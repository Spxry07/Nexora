<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Nexora Editor</title>
<style>
:root{--bg:#10131a;--panel:#1d222e;--panel2:#262c3b;--lo:#0a0c11;--hi:#4b5469;--text:#eef2fb;--muted:#aab4ca;--accent:#6293F0;--accent2:#9dbaff;--danger:#ff5555;--ok:#55ff8a;--btn:#3d4558;--btn-hi:#7a86a3;--btn-lo:#171b25;--btn-hover:#4f5b78;--field:#0a0d13;--inspw:410px;--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--pix:"Pixelify Sans","Courier New",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14.5px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
input[type=number],.val{font-variant-numeric:tabular-nums}
.brand,.card>h2,.itab,dialog h3,.sub{font-family:var(--pix);letter-spacing:.02em}
button{cursor:pointer}
[hidden]{display:none!important}
.tex{image-rendering:pixelated;display:block}
.muted{color:var(--muted)}
.grow{flex:1}
#app{display:grid;grid-template-columns:268px minmax(0,1fr) var(--inspw);height:100vh;height:100dvh}
#app.wide{--inspw:min(700px,54vw)}
#side{background:var(--panel);border-right:2px solid var(--lo);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-head{padding:12px 12px 6px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;letter-spacing:.02em;color:var(--accent);font-size:20px;text-shadow:2px 2px 0 #000a}
.search-row{display:flex;gap:6px;padding:4px 12px 8px}
.search-row input{flex:1;min-width:0}
.chips{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.chip{background:var(--field);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:1px 9px;font-size:13px;color:var(--muted)}
.chip.on{background:#2c4a8c;color:#fff;border-color:var(--hi) var(--lo) var(--lo) var(--hi)}
.chip:hover{color:#fff}
#list{list-style:none;margin:0;padding:0 8px 12px;overflow:auto;flex:1}
#list button{width:100%;text-align:left;background:none;border:2px solid transparent;padding:5px 6px;display:flex;gap:8px;align-items:center}
#list button:hover{background:var(--panel2)}
#list button.on{background:#25365e;border-color:var(--accent)}
#list .ic{width:28px;height:28px;flex:none;display:grid;place-items:center}
#list .ic img,#list .ic svg{width:28px;height:28px}
#list .tx{min-width:0}
#list .id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .pos{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--muted)}
.btn{background:var(--btn);border:2px solid;border-color:var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);box-shadow:inset -2px -2px 0 #0003,inset 2px 2px 0 #fff1;padding:4px 12px;white-space:nowrap;text-shadow:1px 1px 0 #000a;color:#fff;line-height:1.3}
.btn:hover:not(:disabled){background:var(--btn-hover);outline:2px solid var(--accent);outline-offset:-2px}
.btn:active:not(:disabled){border-color:var(--btn-lo) var(--btn-hi) var(--btn-hi) var(--btn-lo);box-shadow:inset 2px 2px 0 #0004}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary,.btn.on{background:#3b62b8}
.btn.primary:hover:not(:disabled),.btn.on:hover:not(:disabled){background:#4a76d6}
.btn.danger{color:#ff8a8a}
.btn.sm{padding:1px 8px;font-size:13px}
.btn.sq{width:36px;height:36px;padding:0;font-size:20px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--field);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:4px 8px;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
select option{background:#0a0d13}
textarea{resize:vertical;min-height:56px;font-family:var(--font)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:var(--field);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:22px;margin-top:-7px;background:#8590aa;border:2px solid;border-color:#c0c8dc #3a4256 #3a4256 #c0c8dc}
input[type=range]::-moz-range-track{height:8px;background:var(--field);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
input[type=range]::-moz-range-thumb{width:8px;height:18px;border-radius:0;background:#8590aa;border:2px solid;border-color:#c0c8dc #3a4256 #3a4256 #c0c8dc}
input[type=range]:hover::-webkit-slider-thumb{background:var(--accent2)}
input[type=color]{width:38px;height:32px;padding:0;border:2px solid var(--lo);background:none;flex:none}
#mapwrap{position:relative;min-width:0;min-height:0;background:#0d1017;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mapbar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mapbar select{width:auto;max-width:150px}
#menuBtn,#inspToggle{display:none}
.ind{background:#000b;border:2px solid var(--lo);padding:2px 10px;font-size:13px;color:var(--muted)}
.ind[data-k=saved]{color:var(--ok)}
.ind[data-k=error]{color:var(--danger)}
.ind[data-k=pending],.ind[data-k=saving]{color:#ffd966}
.zoombar{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.coordbar{position:absolute;left:8px;bottom:8px;background:#000b;padding:2px 8px;font-size:13px;pointer-events:none}
.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 220px);background:#000b;padding:3px 10px;font-size:12px;text-align:center;pointer-events:none;color:var(--muted)}
#insp{background:var(--panel);border-left:2px solid var(--lo);display:flex;flex-direction:column;min-height:0;min-width:0}
#inspHead{padding:10px 12px 8px;border-bottom:2px solid var(--lo);background:var(--panel2)}
.ititle{display:flex;align-items:center;gap:8px}
.ititle h1{margin:0;font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:1px 7px;background:#2c4a8c;color:#fff;flex:none}
.isub{font-size:12px;color:var(--muted);margin:2px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.itabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--panel2);overflow-x:auto;flex:none}
.itab{background:var(--btn-lo);border:2px solid;border-color:var(--hi) var(--lo) transparent var(--hi);padding:3px 12px;color:var(--muted);flex:none}
.itab.on{background:var(--panel);color:#fff;border-color:var(--hi) var(--lo) var(--panel) var(--hi)}
.itab:hover{color:#fff}
#inspBody{flex:1;overflow:auto;padding:12px;min-height:0}
.card{background:var(--panel2);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);margin-bottom:12px}
.card>h2{margin:0;padding:6px 10px;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.02em;background:#00000030;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .body{padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label{font-size:12px;color:var(--muted)}
.row2{display:flex;gap:8px;align-items:center}
.row2 input[type=number]{width:84px;flex:none}
.row2 input[type=range]{flex:1;min-width:0}
.val{min-width:64px;text-align:right;font-size:13px;color:var(--accent2)}
.switch{position:relative;display:inline-block;width:46px;height:26px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--field);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.switch span:before{content:"";position:absolute;top:1px;left:1px;width:18px;height:18px;background:#8590aa;border:2px solid;border-color:#c0c8dc #3a4256 #3a4256 #c0c8dc;transition:transform .1s}
.switch input:checked+span{background:#2c4a8c}
.switch input:checked+span:before{transform:translateX(18px);background:var(--accent2)}
.switch input:focus-visible+span{outline:2px solid var(--accent)}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-row input[type=text]{width:104px}
.color-row input[type=range]{flex:1;min-width:70px}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:24px;height:24px;border:2px solid;border-color:#ffffff90 #00000090 #00000090 #ffffff90;padding:0}
.sw.on{outline:2px solid #fff;outline-offset:1px}
.sw:hover{transform:scale(1.12)}
.slot-mc{width:48px;height:48px;flex:none;background:#14182200;background-color:#161a24;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);display:grid;place-items:center;padding:0;position:relative}
.slot-mc:hover{outline:2px solid var(--accent);outline-offset:-2px;background-color:#1f2636}
.slot-mc img{width:32px;height:32px}
.slot-mc .plus{color:var(--muted);font-size:22px}
.slot-mc.on{outline:2px solid var(--accent);outline-offset:-2px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.slotcell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-align:center}
.slotcell .slot-mc{width:54px;height:54px}
.slotcell .slot-mc img{width:36px;height:36px}
.mobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;max-height:210px;overflow:auto;padding:4px;background:var(--field);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.mob{background:var(--btn-lo);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:11px;color:var(--muted);min-width:0}
.mob span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob img{width:32px;height:32px}
.mob:hover{background:var(--btn);color:#fff}
.mob.on{border-color:var(--accent);background:#25365e;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pcard{background:var(--btn);border:2px solid;border-color:var(--btn-hi) var(--btn-lo) var(--btn-lo) var(--btn-hi);box-shadow:inset -2px -2px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;min-height:84px;text-align:center;font-size:13px;text-shadow:1px 1px 0 #000a;color:#fff}
.pcard:hover{background:var(--btn-hover);outline:2px solid var(--accent);outline-offset:-2px}
.pcard.on{background:#2f4f99;border-color:var(--accent2) #1b2c57 #1b2c57 var(--accent2)}
.pcard small{color:#c3cbe0;font-size:11px;text-shadow:none;line-height:1.1}
.ico{color:var(--accent2)}
.pcard .ico{width:30px;height:30px}
.shape-cv{width:56px;height:56px;background:#0b0e14;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.mcard{background:var(--btn-lo);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);margin-bottom:8px}
.mcard.on{border-color:var(--accent2) #1b2c57 #1b2c57 var(--accent2);background:#1f2a47}
.mcard>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 10px;text-align:left}
.mcard>button:hover{background:#ffffff10}
.mcard .ico{width:26px;height:26px;flex:none;color:var(--muted)}
.mcard.on .ico{color:var(--accent2)}
.mcard .mt{flex:1}
.mcard .mb{padding:4px 10px 10px}
.mcard.on .mi.spin{animation:kspin 2s linear infinite}
.mcard.on .mi.orbit{animation:kspin 3s linear infinite}
.mcard.on .mi.bob{animation:kbob 1s ease-in-out infinite}
.mcard.on .mi.pulse{animation:kpulse 1s ease-in-out infinite}
.mcard.on .mi.sway{transform-origin:50% 90%;animation:ksway 1.4s ease-in-out infinite}
.mcard.on .mi.wave{animation:kwave 1s ease-in-out infinite}
@keyframes kspin{to{transform:rotate(360deg)}}
@keyframes kbob{50%{transform:translateY(-4px)}}
@keyframes kpulse{50%{transform:scale(1.25)}}
@keyframes ksway{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes kwave{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.sub{margin:10px 0 6px;font-size:13px;color:var(--accent);letter-spacing:.02em}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.line{border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);margin-bottom:8px;background:var(--btn-lo)}
.line-head{display:flex;gap:4px;align-items:center;padding:4px 6px}
.line-toggle{flex:1;min-width:0;background:none;border:0;text-align:left;display:flex;gap:8px;align-items:center;padding:3px}
.line-toggle .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.line-toggle .i{font-weight:600;color:var(--accent);flex:none}
.line-body{padding:4px 10px 10px;border-top:2px solid var(--lo)}
.qline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:start;margin-bottom:8px}
.qline .ix{color:var(--accent);padding-top:4px;min-width:22px}
.qline textarea{min-height:44px}
.qline select{margin-bottom:4px}
.stack-col{display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.qprev{width:140px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:radial-gradient(circle at 50% 35%,#27324d,#0b0e14 75%);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:8px 4px;text-align:center;font-size:12px}
.qprev .big{width:72px;height:72px}
.qfields{flex:1;min-width:190px;display:flex;flex-direction:column;gap:10px}
.skinbox{width:130px;height:190px;position:relative}
.skinbox canvas{width:130px;height:190px;display:block}
.skinbox .fb{width:130px;height:190px;object-fit:contain}
.plate{background:#00000060;text-shadow:1px 1px 0 #000a;min-height:24px;margin-top:4px}
.stage{min-height:150px;max-height:260px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);display:flex;align-items:center;justify-content:center;padding:18px 8px;overflow:auto;background:radial-gradient(circle at 50% 30%,#1c2438,#0a0d14 70%),#0a0d14;position:relative}
.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.stack{display:flex;flex-direction:column;align-items:center;gap:var(--gap,6px);position:relative;max-width:100%}
.pv-line{position:relative;max-width:100%}
.box{padding:2px 5px;font-family:var(--pix);white-space:pre-wrap;word-break:break-word;line-height:1.25}
.nvwrap{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.nv{position:relative;flex:1;min-width:0;height:var(--nvh,340px);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:radial-gradient(circle at 50% 38%,#2a3555,#0b0e14 78%);overflow:hidden;touch-action:none}
.nv.tall{--nvh:420px}
.nv canvas{position:absolute;left:0;top:0;display:block}
.nv .ov{pointer-events:none}
.nv .fb{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.nv .cap{position:absolute;left:6px;bottom:4px;font-size:12px;color:var(--muted);pointer-events:none;text-shadow:1px 1px 0 #000}
.badges{display:flex;flex-direction:column;gap:6px;width:60px;flex:none}
.badge{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--muted);background:var(--field);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:3px 1px;text-align:center;line-height:1.1}
.badge img{width:28px;height:28px}
.scene3{position:relative;height:300px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#0a0d14;overflow:hidden;touch-action:none}
.scene3 canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab}
.tl{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.fr{flex:none;min-width:58px;background:var(--btn-lo);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:3px 8px;text-align:center;color:var(--muted);line-height:1.2}
.fr b{display:block;color:var(--text);font-weight:600}
.fr.on{background:#2f4f99;color:#fff;border-color:var(--accent2) #1b2c57 #1b2c57 var(--accent2)}
.fr.cur{outline:2px solid var(--ok);outline-offset:-2px}
.limbrow{background:var(--btn-lo);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:6px 8px 8px;margin-bottom:6px}
.limbrow.on{border-color:var(--accent2) #1b2c57 #1b2c57 var(--accent2);background:#1f2a47}
.limbrow .lh{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px}
.limbrow .lh button.nm{background:none;border:0;padding:0;font-weight:600;color:var(--text)}
.axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.axis{display:flex;flex-direction:column;gap:0;min-width:0}
.axis .ah{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.axis .ah input{width:100%;min-width:0;padding:1px 4px}
.tbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tbar input[type=range]{flex:1;min-width:120px}
.warn{color:var(--danger)}
.okc{color:var(--ok)}
.hintbox{background:#2a2410;border:2px solid #7a6420;padding:8px 10px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hintbox.good{background:#10281a;border-color:#2f7a4a}
.hintbox span{flex:1;min-width:180px}
.modechips{display:flex;gap:6px;flex-wrap:wrap}
.modechips .chip{padding:3px 12px;font-size:13.5px}
.box .r{min-height:1.25em}
.box img{width:100%;height:100%}
.tile{border:2px solid #4c5d82;background:#27324a;display:grid;place-items:center;color:#cfd8ee}
.pv-meta{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);border-left:5px solid var(--accent);padding:8px 12px;box-shadow:0 8px 24px #0008;max-width:380px;word-break:break-word}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
dialog{background:var(--panel);color:var(--text);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:16px;width:min(94vw,400px)}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 10px;font-weight:600;color:var(--accent)}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg .btn{flex:1}
#pickDlg{width:min(96vw,640px);max-height:88vh;padding:12px}
#pickDlg[open]{display:flex;flex-direction:column;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;overflow:auto;min-height:160px;flex:1;padding:4px}
.pgrid .slot-mc{width:100%;height:50px}
.pk-foot{display:flex;gap:8px;align-items:center}
#pickHover{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#scrim{display:none}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px;z-index:400}
#gate div{max-width:420px}
#gate h2{color:var(--accent);margin:0 0 8px}
@media (max-width:1180px){
#app{grid-template-columns:268px minmax(0,1fr)}

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {

async function api(path, body) {
  const post = body !== undefined;
  const res = await fetch(path, {
    method: post ? 'POST' : 'GET',
    headers: Object.assign({Authorization: 'Bearer ' + token}, post ? {'Content-Type': 'application/json'} : {}),
    body: post ? JSON.stringify(body) : undefined
  });

  try { data = await res.json(); } catch (e) { data = null; }
  if (res.status === 401) {
    gate(data && data.error);
    throw new Error(data && data.error || 'Unauthorized');
  }
  if (!res.ok) throw new Error(data && data.error || res.statusText);
  return data;
}

}

function iconEl(o, size) {
  if (o.kind === 'hologram') return holoIcon(size);
  return isPlayerType(o.entityType) ? headEl(o.skinId, size) : texEl(entityTex(o.entityType), size);
}

const OBF = 'abcdefghijklmnopqrstuvwxyz0123456789';

function parseText(text) {
  const out = [];
  let st = Object.assign({}, RESET);
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '&' && i + 1 < text.length) {
      const n = text[i + 1];
      const lower = n.toLowerCase();
      if (n === '#' && /^[0-9a-fA-F]{6}$/.test(text.slice(i + 2, i + 8))) {
        st = Object.assign({}, RESET, {c: '#' + text.slice(i + 2, i + 8).toUpperCase()});
        i += 7;
        continue;
      }
      if (COLORS[lower]) { st = Object.assign({}, RESET, {c: COLORS[lower]}); i++; continue; }
      if (lower === 'r') { st = Object.assign({}, RESET); i++; continue; }
      const flag = {l: 'b', o: 'i', n: 'u', m: 's', k: 'k'}[lower];
      if (flag) { st = Object.assign({}, st); st[flag] = true; i++; continue; }
    }
    out.push({ch, st});
  }
  return out;
}

function fmtDate(pattern, d) {
  const p = n => String(n).padStart(2, '0');
  return String(pattern || '').replace(/yyyy|MM|dd|HH|mm|ss/g, t => ({yyyy: d.getFullYear(), MM: p(d.getMonth() + 1), dd: p(d.getDate()), HH: p(d.getHours()), mm: p(d.getMinutes()), ss: p(d.getSeconds())})[t]);
}

function placeholders(text) {
  const ph = S.cfg.placeholders, now = new Date();
  return text.replace(/\{(online|max|time|date|player)\}/g, (m, k) => ({online: ph.online, max: ph.max, time: fmtDate(ph.timeFormat, now), date: fmtDate(ph.dateFormat, now), player: SAMPLE_PLAYER})[k]);
}

function unitHash(step, ident) {
  let h = Math.imul(step | 0, 0x9E3779B1) ^ Math.imul((ident | 0) + 1, 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 16), 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function fxNum(fx, key, def) {
  const v = Number(fx && fx[key]);
  return Number.isFinite(v) && fx[key] !== '' && fx[key] != null ? v : def;
}

function recolor(chars, rgb) {
  return chars.map(c => ({ch: c.ch, st: Object.assign({}, c.st, {c: rgb})}));
}

function applyEffect(chars, line, tick, ident) {
  const fx = S.cfg.effects;
  const step = Math.floor(tick / Math.max(1, Number(line['effect-speed']) || 1));
  switch (line.effect) {
    case 'SOLID':
      return recolor(chars, parseColor(line['color-a'], '#FFFFFF').rgb);
    case 'FLICKER':
      return recolor(chars, parseColor(unitHash(step, ident || 0) < fxNum(fx, 'flickerChance', FLICKER_CHANCE_DEF) ? line['color-b'] : line['color-a'], '#FFFFFF').rgb);
    case 'FADE':
      return recolor(chars, mix(line['color-a'], line['color-b'], 0.5 + 0.5 * Math.sin(step * fxNum(fx, 'fadeStep', FADE_STEP_DEF) * TAU)));
    case 'TYPEWRITER': {
      const total = chars.filter(c => c.ch !== '\n').length;
      const n = step % (total + fx.typewriterHold);
      const out = [];
      let seen = 0;
      for (const c of chars) {
        if (c.ch !== '\n') { if (seen >= n) break; seen++; }
        out.push(c);
      }
      return out;
    }
    case 'RAINBOW':
      return chars.map((c, i) => ({ch: c.ch, st: Object.assign({}, c.st, {c: hsv((step * fx.rainbowStep + i * fx.rainbowSpread) % 1, fx.rainbowSaturation, fx.rainbowBrightness)})}));
    case 'WAVE':
      return chars.map((c, i) => ({ch: c.ch, st: Object.assign({}, c.st, {c: mix(line['color-a'], line['color-b'], (Math.sin(step * fx.waveStep + i * fx.waveSpread) + 1) / 2)})}));
    case 'SCROLL': {
      const width = Math.max(1, Number(line['scroll-width']) || 16);
      const flat = chars.map(c => c.ch === '\n' ? {ch: ' ', st: c.st} : c);
      if (flat.length <= width) return flat;
      const gap = Array.from(fx.scrollGap || ' ', () => ({ch: ' ', st: RESET}));
      const padded = flat.concat(gap);
      const offset = step % padded.length;
      return Array.from({length: width}, (_, i) => padded[(offset + i) % padded.length]);
    }
    case 'BLINK':
      return step % 2 === 1 ? [] : chars;
    default:
      return chars;
  }
}

function sameStyle(a, b) {
  return a.c === b.c && a.b === b.b && a.i === b.i && a.u === b.u && a.s === b.s && a.k === b.k;
}

function charsToRows(chars) {
  const rows = [el('div', {class: 'r'})];
  let run = null;
  for (const c of chars) {
    if (c.ch === '\n') { rows.push(el('div', {class: 'r'})); run = null; continue; }
    const row = rows[rows.length - 1];
    const ch = c.st.k ? OBF[Math.floor(Math.random() * OBF.length)] : c.ch;
    if (run && sameStyle(run.st, c.st)) { run.node.textContent += ch; continue; }
    const node = el('span', {text: ch});
    node.style.color = c.st.c;
    if (c.st.b) node.style.fontWeight = '700';
    if (c.st.i) node.style.fontStyle = 'italic';
    const deco = [c.st.u ? 'underline' : '', c.st.s ? 'line-through' : ''].filter(Boolean).join(' ');
    if (deco) node.style.textDecoration = deco;
    row.append(node);
    run = {node, st: c.st};
  }
  return rows;
}

function textChars(text, line, tick, ident) {
  let frame = String(text || '');
  const sep = S.cfg.frameSeparator;
  if (sep && frame.includes(sep)) {
    const frames = frame.split(sep);
    frame = frames[Math.floor(tick / Math.max(1, Number(line['frame-interval']) || 1)) % frames.length].trim();
  }
  return applyEffect(parseText(placeholders(frame)), line, tick, ident);
}

function renderText(text, line, tick) {
  return charsToRows(textChars(text, line, tick, 0));
}

function mMul(a, b) {
  const o = new Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
  return o;
}
function mRx(a) { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; }
function mRy(a) { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
function mRz(a) { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; }
function mVec(m, v) { return [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]]; }
function vAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function vDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function vCross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function vNorm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

function holoParams() {
  const p = S.props;
  return {
    layout: String(p.layout || 'STACK').toUpperCase(),
    radius: num(p['layout-radius']),
    layoutSpeed: num(p['layout-speed']),
    helix: num(p['helix-step']),
    spacing: num(p['line-spacing']) || 0.3,
    waveH: num(p['wave-height']),
    waveS: num(p['wave-speed']),
    spin: num(p['spin-speed']),
    bobH: num(p['bob-height']),
    bobS: num(p['bob-speed']),
    orbitR: num(p['orbit-radius']),
    orbitS: num(p['orbit-speed']),
    pulseA: num(p['pulse-amount']),
    pulseS: num(p['pulse-speed']),
    swayA: num(p['sway-angle']),
    swayS: num(p['sway-speed']),
    yaw: S.cur ? num(S.cur.yaw) : 0
  };
}

function lineParams(l) {
  return {
    scale: Math.max(0.01, Number(l.scale) || 1),
    offX: num(l['offset-x']),
    offY: num(l['offset-y']),
    offZ: num(l['offset-z']),
    rx: num(l['rot-x']) * DEG,
    ry: num(l['rot-y']) * DEG,
    rz: num(l['rot-z']) * DEG,
    bb: String(l.billboard || 'CENTER').toUpperCase()
  };
}

function holoCenter(h, secs) {
  const a = TAU * h.orbitS * secs;
  const y = h.bobH > 0 ? h.bobH * Math.sin(TAU * h.bobS * secs) : 0;
  return h.orbitR > 0 ? [h.orbitR * Math.cos(a), y, h.orbitR * Math.sin(a)] : [0, y, 0];
}

function holoPlace(h, lp, i, n, c, secs) {
  const yawRad = h.yaw * DEG;
  const cnt = Math.max(1, n);
  let y = c[1];
  if (h.waveH > 0) y += h.waveH * Math.sin(TAU * h.waveS * secs + TAU * i / cnt);
  const turn = h.layoutSpeed * DEG * secs;
  const circle = (yy, r, a) => {
    const dx = Math.cos(a), dz = Math.sin(a);
    return [c[0] + r * dx, yy, c[2] + r * dz, Math.atan2(-dx, dz) / DEG];
  };
  let p;
  switch (h.layout) {
    case 'RING':
      p = circle(y + lp.offY, h.radius, TAU * i / cnt + turn);
      break;
    case 'WHEEL': {
      const a = TAU * i / cnt + turn;
      const side = h.radius * Math.cos(a);
      p = [c[0] - Math.cos(yawRad) * side, y + lp.offY + h.radius * Math.sin(a), c[2] - Math.sin(yawRad) * side, h.yaw];
      break;
    }
    case 'SPHERE': {
      const uy = 1 - 2 * (i + 0.5) / cnt;
      const ring = Math.sqrt(Math.max(0, 1 - uy * uy));
      const th = GOLDEN_ANGLE * i + turn;
      const dx = Math.cos(th) * ring, dz = Math.sin(th) * ring;
      p = [c[0] + h.radius * dx, y + lp.offY + h.radius * uy, c[2] + h.radius * dz, Math.atan2(-dx, dz) / DEG];
      break;
    }
    case 'TORNADO': {
      const level = n <= 1 ? 1 : (n - 1 - i) / (n - 1);
      p = circle(y + (n - 1 - i) * h.spacing + lp.offY, h.radius * Math.max(TORNADO_MIN_RADIUS, level), h.helix * DEG * i + turn);
      break;
    }
    case 'HELIX':
      p = circle(y + (n - 1 - i) * h.spacing + lp.offY, h.radius, h.helix * DEG * i + turn);
      break;
    case 'ROW': {
      const along = (i - (n - 1) / 2) * h.spacing;
      p = [c[0] - Math.cos(yawRad) * along, y + lp.offY, c[2] - Math.sin(yawRad) * along, h.yaw];
      break;
    }
    default:
      p = [c[0], y + (n - 1 - i) * h.spacing + lp.offY, c[2], h.yaw];
  }
  if (lp.offX || lp.offZ) {
    const s = Math.sin(yawRad), co = Math.cos(yawRad);
    p[0] += -co * lp.offX - s * lp.offZ;
    p[2] += -s * lp.offX + co * lp.offZ;
  }
  return p;
}

const measureCtx = document.createElement('canvas').getContext('2d');
const charWidths = new Map();
function charFont(st) { return (st.i ? 'italic ' : '') + (st.b ? '700' : '500') + ' ' + TEX_FONT + 'px ' + FONT_PIX; }
function charW(ch, st) {
  const font = charFont(st);
  const key = fontEpoch + font + ch;
  let w = charWidths.get(key);
  if (w == null) {
    measureCtx.font = font;
    w = measureCtx.measureText(ch).width;
    charWidths.set(key, w);
  }
  return w;
}

function layoutChars(chars, maxW) {
  const rows = [];
  let cur = [], curW = 0, sp = -1;
  for (const c of chars) {
    if (c.ch === '\n') { rows.push(cur); cur = []; curW = 0; sp = -1; continue; }
    const w = charW(c.ch, c.st);
    if (curW + w > maxW && cur.length) {
      if (sp >= 0) {
        const rest = cur.splice(sp + 1);
        rows.push(cur);
        cur = rest;
        curW = rest.reduce((a, x) => a + x.w, 0);
      } else {
        rows.push(cur);
        cur = [];
        curW = 0;
      }
      sp = -1;
    }
    cur.push({ch: c.ch, st: c.st, w});
    curW += w;
    if (c.ch === ' ') sp = cur.length - 1;
  }
  rows.push(cur);
  return rows;
}

function rowWidth(r) {
  let e = r.length;
  while (e > 0 && r[e - 1].ch === ' ') e--;
  let w = 0;
  for (let i = 0; i < e; i++) w += r[i].w;
  return w;
}

function textSig(chars, l) {
  let s = fontEpoch + '|' + [l['line-width'], l.alignment, l.background, l['background-default'], l.opacity, l.shadow].join(',') + '|';
  for (const c of chars) s += c.ch + c.st.c + (c.st.b ? 'b' : '') + (c.st.i ? 'i' : '') + (c.st.u ? 'u' : '') + (c.st.s ? 's' : '') + (c.st.k ? Math.random() : '');
  return s;
}

function buildTextTex(chars, l) {
  const maxW = Math.max(8, (Number(l['line-width']) || DEFAULT_LINE_WIDTH) * TEX_K);
  const rows = layoutChars(chars, maxW);
  const widths = rows.map(rowWidth);
  const textW = Math.max(1, Math.ceil(Math.max(0, ...widths)));
  const W = Math.min(TEX_MAX_W, textW + TEX_PAD * 2);
  const Hh = rows.length * TEX_LINE + TEX_PAD * 2;
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = Hh;
  const g = cv.getContext('2d');
  g.fillStyle = l['background-default'] === 'true' ? 'rgba(0,0,0,.25)' : rgba(parseColor(l.background, '#000000'));
  g.fillRect(0, 0, W, Hh);
  g.textBaseline = 'middle';
  g.textAlign = 'left';
  g.globalAlpha = clamp(Number(l.opacity) || 255, 30, 255) / 255;
  const align = String(l.alignment || 'CENTER').toUpperCase();
  const shadow = l.shadow === 'true';
  rows.forEach((r, ri) => {
    let x = align === 'LEFT' ? TEX_PAD : align === 'RIGHT' ? W - TEX_PAD - widths[ri] : (W - widths[ri]) / 2;
    const cy = TEX_PAD + ri * TEX_LINE + TEX_LINE / 2;
    for (const c of r) {
      const ch = c.st.k ? OBF[Math.floor(Math.random() * OBF.length)] : c.ch;
      g.font = charFont(c.st);
      if (shadow) { g.fillStyle = mix(c.st.c, '#000000', 0.75); g.fillText(ch, x + TEX_K, cy + TEX_K); }
      g.fillStyle = c.st.c;
      g.fillText(ch, x, cy);
      if (c.st.u) g.fillRect(x, cy + TEX_FONT / 2, c.w, TEX_K);
      if (c.st.s) g.fillRect(x, cy - 1, c.w, TEX_K);
      x += c.w;
    }
  });
  return {canvas: cv, w: W, h: Hh};
}

function orientFor(bb, yawDeg, cam, elev) {
  if (bb === 'CENTER') return [cam.right[0], cam.up[0], -cam.f[0], cam.right[1], cam.up[1], -cam.f[1], cam.right[2], cam.up[2], -cam.f[2]];
  if (bb === 'VERTICAL') return mRy(Math.atan2(-cam.f[0], -cam.f[2]));
  if (bb === 'HORIZONTAL') return mMul(mRy(-yawDeg * DEG), mRx(-elev));
  return mRy(-yawDeg * DEG);
}

const CUBE = [
  {tl: [-1, 1, 1], tr: [1, 1, 1], bl: [-1, -1, 1], shade: 0.82},
  {tl: [1, 1, -1], tr: [-1, 1, -1], bl: [1, -1, -1], shade: 0.82},
  {tl: [1, 1, 1], tr: [1, 1, -1], bl: [1, -1, 1], shade: 0.66},
  {tl: [-1, 1, -1], tr: [-1, 1, 1], bl: [-1, -1, -1], shade: 0.66},
  {tl: [-1, 1, -1], tr: [1, 1, -1], bl: [-1, 1, 1], shade: 1},
  {tl: [-1, -1, 1], tr: [1, -1, 1], bl: [-1, -1, -1], shade: 0.5}
];

function quadOf(base, M, tl, tr, bl) {
  const w = v => vAdd(base, mVec(M, v));
  return {tl: w(tl), tr: w(tr), bl: w(bl)};
}

function sceneCamera(sc, W, H) {
  const ce = Math.cos(sc.el);
  const dir = [Math.sin(sc.az) * ce, Math.sin(sc.el), Math.cos(sc.az) * ce];
  const pos = vAdd(sc.target, dir.map(x => x * sc.dist));
  const f = vNorm(vSub(sc.target, pos));
  const right = vNorm(vCross(f, [0, 1, 0]));
  const up = vCross(right, f);
  return {pos, f, right, up, F: (H / 2) / Math.tan(VIEW_FOV / 2), W, H};
}

function project(cam, v) {
  const r = vSub(v, cam.pos);
  const z = vDot(r, cam.f);
  if (z < NEAR) return null;
  return {x: cam.W / 2 + vDot(r, cam.right) / z * cam.F, y: cam.H / 2 - vDot(r, cam.up) / z * cam.F, z};
}

function projectSegment(cam, a, b) {
  const za = vDot(vSub(a, cam.pos), cam.f), zb = vDot(vSub(b, cam.pos), cam.f);
  if (za < NEAR && zb < NEAR) return null;
  let p = a, q = b;
  if (za < NEAR) p = vAdd(a, vSub(b, a).map(x => x * (NEAR - za) / (zb - za)));
  else if (zb < NEAR) q = vAdd(a, vSub(b, a).map(x => x * (NEAR - za) / (zb - za)));
  const pa = project(cam, p), pb = project(cam, q);
  return pa && pb ? [pa, pb] : null;
}

function lerp3(q, u, v) {
  return [q.tl[0] + (q.tr[0] - q.tl[0]) * u + (q.bl[0] - q.tl[0]) * v, q.tl[1] + (q.tr[1] - q.tl[1]) * u + (q.bl[1] - q.tl[1]) * v, q.tl[2] + (q.tr[2] - q.tl[2]) * u + (q.bl[2] - q.tl[2]) * v];
}

function drawQuad(g, cam, q, dpr) {
  const cols = q.nx, rows = q.ny;
  const nodes = [];
  for (let j = 0; j <= rows; j++) {
    for (let i = 0; i <= cols; i++) {
      const pj = project(cam, lerp3(q, i / cols, j / rows));
      if (!pj) return;
      nodes.push(pj);
    }
  }
  const stride = cols + 1;
  if (!q.tex) {
    g.fillStyle = q.fill || '#3a4254';
    g.beginPath();
    g.moveTo(nodes[0].x, nodes[0].y);
    g.lineTo(nodes[cols].x, nodes[cols].y);
    g.lineTo(nodes[rows * stride + cols].x, nodes[rows * stride + cols].y);
    g.lineTo(nodes[rows * stride].x, nodes[rows * stride].y);
    g.closePath();
    g.fill();
    return;
  }
  g.imageSmoothingEnabled = q.smooth;
  const sw = q.tw / cols, sh = q.th / rows;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const p00 = nodes[j * stride + i], p10 = nodes[j * stride + i + 1], p01 = nodes[(j + 1) * stride + i];
      g.setTransform(dpr * (p10.x - p00.x) / sw, dpr * (p10.y - p00.y) / sw, dpr * (p01.x - p00.x) / sh, dpr * (p01.y - p00.y) / sh, dpr * p00.x, dpr * p00.y);
      g.drawImage(q.tex, i * sw, j * sh, sw, sh, 0, 0, sw + 0.4, sh + 0.4);
    }
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (q.shade < 1) {
    g.fillStyle = 'rgba(0,0,0,' + (1 - q.shade).toFixed(3) + ')';
    g.beginPath();
    g.moveTo(nodes[0].x, nodes[0].y);
    g.lineTo(nodes[cols].x, nodes[cols].y);
    g.lineTo(nodes[rows * stride + cols].x, nodes[rows * stride + cols].y);
    g.lineTo(nodes[rows * stride].x, nodes[rows * stride].y);
    g.closePath();
    g.fill();
  }
}

function sceneQuads(sc, cam, secs, tick) {
  const h = holoParams();
  const n = S.lines.length;
  const center = holoCenter(h, secs);
  const spin = h.spin * DEG * secs;
  const sway = h.swayA * DEG * Math.sin(TAU * h.swayS * secs);
  const pulse = 1 + h.pulseA * Math.sin(TAU * h.pulseS * secs);
  const out = [];
  for (let i = 0; i < n; i++) {
    const l = S.lines[i].props;
    const lp = lineParams(l);
    const p = holoPlace(h, lp, i, n, center, secs);
    const base = [p[0], p[1], p[2]];
    const R = mMul(mMul(mRy(spin), mRz(sway)), mMul(mRy(lp.ry), mMul(mRx(lp.rx), mRz(lp.rz))));
    const M = mMul(orientFor(lp.bb, p[3], cam, sc.el), R);
    const k = lp.scale * pulse;
    const type = String(l.type || 'TEXT').toUpperCase();
    if (type === 'TEXT') {
      const chars = textChars(l.text, l, tick, i);
      const sig = textSig(chars, l);
      let t = sc.tex[i];
      if (!t || t.sig !== sig) { t = buildTextTex(chars, l); t.sig = sig; sc.tex[i] = t; }
      const w = t.w * BLOCK_PER_TEXPX * k, hh = t.h * BLOCK_PER_TEXPX * k;
      const q = quadOf(base, M, [-w / 2, hh, 0], [w / 2, hh, 0], [-w / 2, 0, 0]);
      q.tex = t.canvas;
      q.tw = t.w;
      q.th = t.h;
      q.smooth = true;
      q.shade = 1;
      q.nx = clamp(Math.round(t.w / 64), 1, 8);
      q.ny = clamp(Math.round(t.h / 40), 1, 3);
      out.push(q);
      continue;
    }
    const name = String(l.material || '').toLowerCase();
    const e = name ? texNow(name) : null;
    if (type === 'ITEM') {
      const s = k / 2;
      const q = quadOf(base, M, [-s, s, 0], [s, s, 0], [-s, -s, 0]);
      q.tex = e ? e.img : null;
      q.tw = e ? e.img.width : 1;
      q.th = e ? e.img.height : 1;
      q.smooth = false;
      q.shade = 1;
      q.nx = 2;
      q.ny = 2;
      out.push(q);
      continue;
    }
    const s = k / 2;
    for (const f of CUBE) {
      const q = quadOf(base, M, f.tl.map(x => x * s), f.tr.map(x => x * s), f.bl.map(x => x * s));
      q.tex = e ? e.img : null;
      q.tw = e ? e.img.width : 1;
      q.th = e ? e.img.height : 1;
      q.smooth = false;
      q.shade = f.shade;
      q.fill = mix('#3a4254', '#000000', 1 - f.shade);
      q.nx = 2;
      q.ny = 2;
      out.push(q);
    }
  }
  for (const q of out) q.depth = vDot(vSub(lerp3(q, 0.5, 0.5), cam.pos), cam.f);
  out.sort((a, b) => b.depth - a.depth);
  return out;
}

function drawGround(g, cam, h) {
  g.lineWidth = 1;
  for (let i = -GRID_HALF; i <= GRID_HALF; i++) {
    const axis = i === 0;
    g.strokeStyle = axis ? 'rgba(143,178,255,.55)' : 'rgba(120,150,220,.2)';
    for (const seg of [[[i, 0, -GRID_HALF], [i, 0, GRID_HALF]], [[-GRID_HALF, 0, i], [GRID_HALF, 0, i]]]) {
      const s = projectSegment(cam, seg[0], seg[1]);
      if (!s) continue;
      g.beginPath();
      g.moveTo(s[0].x, s[0].y);
      g.lineTo(s[1].x, s[1].y);
      g.stroke();
    }
  }
  const yawRad = h.yaw * DEG;
  const fwd = [-Math.sin(yawRad) * 1.3, 0, Math.cos(yawRad) * 1.3];
  const arrow = projectSegment(cam, [0, 0, 0], fwd);
  if (arrow) {
    g.strokeStyle = ACCENT;
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(arrow[0].x, arrow[0].y);
    g.lineTo(arrow[1].x, arrow[1].y);
    g.stroke();
  }
  const o = project(cam, [0, 0, 0]);
  if (o) {
    g.fillStyle = '#ffffff';
    g.fillRect(o.x - 3, o.y - 3, 6, 6);
  }
  const north = project(cam, [0, 0, -GRID_HALF - 0.5]);
  if (north) {
    g.font = '600 12px ' + FONT_CANVAS;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#9dbaff';
    g.fillText('N', north.x, north.y);
  }
}

function holoScene() {
  const node = el('div', {class: 'scene3'});
  const cvs = el('canvas');
  node.append(cvs);
  const g = cvs.getContext('2d');
  const sc = {az: -(S.cur ? num(S.cur.yaw) : 0) * DEG + 0.5, el: 0.38, dist: 5, target: [0, 0.5, 0], tex: [], W: 0, H: 0, dpr: 1, dead: false, raf: 0, fitted: false};
  const keep = S.sceneCam && S.cur && S.sceneCam.id === S.cur.kind + S.cur.id ? S.sceneCam : null;
  if (keep) Object.assign(sc, {az: keep.az, el: keep.el, dist: keep.dist, target: keep.target, fitted: true});
  const fit = () => {
    const h = holoParams();
    const n = S.lines.length;
    let ymin = Infinity, ymax = -Infinity, r = 0.8;
    for (let s = 0; s < 8; s++) {
      const secs = s * 0.9;
      const c = holoCenter(h, secs);
      for (let i = 0; i < n; i++) {
        const lp = lineParams(S.lines[i].props);
        const p = holoPlace(h, lp, i, n, c, secs);
        ymin = Math.min(ymin, p[1]);
        ymax = Math.max(ymax, p[1] + 0.3 * lp.scale);
        r = Math.max(r, Math.hypot(p[0], p[2]) + 0.8 * lp.scale);
      }
    }
    if (!Number.isFinite(ymin)) { ymin = 0; ymax = 0.6; }
    sc.target = [0, (ymin + ymax) / 2, 0];
    sc.dist = clamp(Math.max(r * 2.3, (ymax - ymin) * 1.8, 3.2), SCENE_MIN_DIST, SCENE_MAX_DIST);
    sc.fitted = true;
  };
  const setView = (az, elev) => { sc.az = az; sc.el = elev; };
  const draw = () => {
    const w = node.clientWidth, hh = node.clientHeight;
    if (!w || !hh) return;
    if (w !== sc.W || hh !== sc.H || sc.dpr !== (window.devicePixelRatio || 1)) {
      sc.W = w;
      sc.H = hh;
      sc.dpr = window.devicePixelRatio || 1;
      cvs.width = Math.round(w * sc.dpr);
      cvs.height = Math.round(hh * sc.dpr);
    }
    if (!sc.fitted && S.lines.length) fit();
    g.setTransform(sc.dpr, 0, 0, sc.dpr, 0, 0);
    const bg = g.createLinearGradient(0, 0, 0, hh);
    bg.addColorStop(0, '#1b2438');
    bg.addColorStop(1, '#090c13');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, hh);
    const cam = sceneCamera(sc, w, hh);
    const secs = (performance.now() - T0) / 1000;
    const tick = Math.floor(secs * 20);
    drawGround(g, cam, holoParams());
    for (const q of sceneQuads(sc, cam, secs, tick)) drawQuad(g, cam, q, sc.dpr);
    g.setTransform(sc.dpr, 0, 0, sc.dpr, 0, 0);
    g.font = '12px ' + FONT_CANVAS;
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(170,180,202,.85)';
    g.fillText('Drag: orbit  |  Wheel: zoom  |  Double-click: fit', 8, hh - 8);
  };
  const frame = () => {
    if (sc.dead) return;
    sc.raf = requestAnimationFrame(frame);
    if (!node.isConnected) { destroy(); return; }
    if (!document.hidden) draw();
  };
  const destroy = () => {
    sc.dead = true;
    cancelAnimationFrame(sc.raf);
    if (S.cur && sc.fitted) S.sceneCam = {id: S.cur.kind + S.cur.id, az: sc.az, el: sc.el, dist: sc.dist, target: sc.target};
  };
  let drag = null;
  cvs.addEventListener('pointerdown', ev => {
    cvs.setPointerCapture(ev.pointerId);
    drag = {id: ev.pointerId, x: ev.clientX, y: ev.clientY};
    cvs.style.cursor = 'grabbing';
  });
  cvs.addEventListener('pointermove', ev => {
    if (!drag || drag.id !== ev.pointerId) return;
    sc.az -= (ev.clientX - drag.x) * SCENE_ORBIT_K;
    sc.el = clamp(sc.el + (ev.clientY - drag.y) * SCENE_ORBIT_K, -1.5, 1.5);
    drag.x = ev.clientX;
    drag.y = ev.clientY;
  });
  const end = () => { drag = null; cvs.style.cursor = 'grab'; };
  cvs.addEventListener('pointerup', end);
  cvs.addEventListener('pointercancel', end);
  cvs.addEventListener('wheel', ev => {
    ev.preventDefault();
    const dy = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
    sc.dist = clamp(sc.dist * Math.exp(dy * SCENE_ZOOM_K), SCENE_MIN_DIST, SCENE_MAX_DIST);
  }, {passive: false});
  cvs.addEventListener('dblclick', fit);
  sc.raf = requestAnimationFrame(frame);
  return {
    node,
    fit,
    setView,
    destroy,
    refresh: () => { sc.tex = []; },
    top: () => setView(sc.az, 1.45),
    side: () => setView(-(S.cur ? num(S.cur.yaw) : 0) * DEG, 0.05)
  };
}

function pvCard() {

const IND = {pending: 'Unsaved...', saving: 'Saving...', saved: 'Saved ✓', error: 'Save failed'};
function setInd(k) {
  const n = $('#saveInd');
  n.textContent = IND[k] || '';
  n.dataset.k = k;
}

let saveTimer = 0;
let saving = null;
let pathTimer = 0;
let pathSaving = null;

function touch() {
  if (!S.cur) return;
  S.pending = true;
  setInd('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(runSave, SAVE_MS);
}

function ref() { return {kind: S.cur.kind, id: S.cur.id}; }

async function runSave() {
  clearTimeout(saveTimer);
  if (saving) await saving;
  if (!S.pending || !S.cur) return;
  S.pending = false;
  const c = S.cur;
  const known = new Set(Object.keys(S.pm));
  const props = {};
  for (const [k, v] of Object.entries(S.props)) if (known.has(k)) props[k] = v;
  const body = {kind: c.kind, id: c.id, props};
  const snap = S.lines.slice();
  if (c.kind === 'hologram') body.lines = snap.map(l => ({ref: l.ref, props: l.props}));
  setInd('saving');
  saving = (async () => {
    try {
      const res = await api('/api/save', body);
      snap.forEach((l, i) => { l.ref = i; });
      setInd(S.pending || S.pathPending ? 'pending' : 'saved');
      if (res && res.invalid && res.invalid.length) {
        toast('Invalid values reset: ' + res.invalid.join(', '), 'err');
        if (S.cur === c && !S.pending) await reloadCurrent();
      }
    } catch (e) {
      S.pending = true;
      setInd('error');
      toast(e.message, 'err');
    }
  })();
  await saving;
  saving = null;
}

function schedulePathSave() {
  S.pathPending = true;
  setInd('pending');
  clearTimeout(pathTimer);
  pathTimer = setTimeout(runPathSave, SAVE_MS);
}

async function runPathSave() {
  clearTimeout(pathTimer);
  if (pathSaving) await pathSaving;
  if (!S.pathPending || !S.cur) return;
  S.pathPending = false;
  const c = S.cur;
  const points = S.path.map(p => [r2(p[0]), r2(p[1]), r2(p[2])]);
  setInd('saving');
  pathSaving = (async () => {
    try {
      const r = await api('/api/waypoints', {kind: c.kind, id: c.id, points});
      c.waypoints = r && r.waypoints != null ? r.waypoints : points.length;
      const o = curEntry();
      if (o) o.pathPoints = c.waypoints;
      setInd(S.pending || S.pathPending ? 'pending' : 'saved');
    } catch (e) {
      S.pathPending = true;
      setInd('error');
      toast(e.message, 'err');
    }
  })();
  await pathSaving;
  pathSaving = null;
}

async function flushAll() {
  clearTimeout(saveTimer);
  clearTimeout(pathTimer);
  if (S.pending || saving) await runSave();
  if (S.pathPending || pathSaving) await runPathSave();
}

function busy() { return S.pending || S.pathPending || saving || pathSaving; }

function curEntry() {
  return S.cur ? S.objects.find(o => o.kind === S.cur.kind && o.id === S.cur.id) : null;
}

const skinSideEffect = debounce(() => { redraw(); renderList(); }, 700);

function setProp(id, v) {
  S.props[id] = v;
  touch();
  const o = curEntry();
  if (o) {
    if (id === 'entity-type') { o.entityType = v; redraw(); renderList(); }
    if (id === 'skin-name' && v) { o.skinId = v; skinSideEffect(); }
  }
  if (S.cur && S.cur.kind === 'hologram') buildPreview();
}

const isOn = id => String(S.props[id]) === 'true';
const nv = id => num(S.props[id]);

function field(prop, id, node, wide) {
  return el('div', {class: 'field' + (wide ? ' wide' : '')}, el('label', {for: id || false, text: prop.label}), node);
}

function stepOf(prop) {
  return prop.step > 0 ? prop.step : (prop.type === 'integer' ? 1 : 'any');
}

function control(prop, value, set) {
  const id = 'f' + (++uid);
  const t = prop.type;
  if (t === 'text') {
    const i = el('input', {type: 'text', id, maxlength: prop.max > 0 ? prop.max : false});
    i.value = value == null ? '' : value;
    i.addEventListener('input', () => set(i.value));
    return field(prop, id, i);
  }
  if (t === 'multiline') {
    const a = el('textarea', {id, rows: 3, maxlength: prop.max > 0 ? prop.max : false});
    a.value = value == null ? '' : value;
    a.addEventListener('input', () => set(a.value));
    return field(prop, id, a, true);
  }
  if (t === 'number' || t === 'integer') {
    const ranged = prop.max > prop.min;
    const step = stepOf(prop);
    const lim = ranged ? {min: prop.min, max: prop.max} : {};
    const num2 = el('input', Object.assign({type: 'number', id, step}, lim));
    const rng = ranged ? el('input', Object.assign({type: 'range', step, 'aria-label': prop.label}, lim)) : null;
    num2.value = value;
    if (rng) {
      rng.value = value;
      rng.addEventListener('input', () => { num2.value = rng.value; set(rng.value); });
    }
    num2.addEventListener('input', () => { if (num2.value !== '' && Number.isFinite(Number(num2.value))) { if (rng) rng.value = num2.value; set(num2.value); } });
    num2.addEventListener('change', () => {
      let v = Number(num2.value);
      if (!Number.isFinite(v)) v = Number(value) || 0;
      if (ranged) v = Math.max(prop.min, Math.min(prop.max, v));
      if (t === 'integer') v = Math.round(v);
      num2.value = v;
      if (rng) rng.value = v;
      set(String(v));
    });
    return field(prop, id, el('div', {class: 'row2'}, rng, num2));
  }
  if (t === 'bool') {
    const c = el('input', {type: 'checkbox', id});
    c.checked = String(value) === 'true';
    c.addEventListener('change', () => set(c.checked ? 'true' : 'false'));
    return field(prop, id, el('label', {class: 'switch'}, c, el('span')));
  }
  if (t === 'choice') {
    const s = el('select', {id}, prop.options.map(o => el('option', {value: o.id, text: o.label})));
    s.value = value;
    if (s.value !== value && value) s.append(el('option', {value, text: value}));
    s.value = value;
    s.addEventListener('change', () => set(s.value));
    return field(prop, id, s);
  }
  if (t === 'color') return colorControl(prop, id, value, set);
  return el('div');
}

function colorControl(prop, id, value, set) {
  const alpha = /AARRGGBB/i.test(prop.label) || /^#?[0-9a-f]{8}$/i.test(String(value || ''));
  const cur = parseColor(value, '#FFFFFF');
  const picker = el('input', {type: 'color', 'aria-label': prop.label});
  const hex = el('input', {type: 'text', id, maxlength: 9, spellcheck: 'false'});
  const a = alpha ? el('input', {type: 'range', min: 0, max: 255, step: 1, 'aria-label': prop.label}) : null;
  const out = () => alpha ? '#' + hex2(cur.a) + cur.rgb.slice(1) : cur.rgb;
  const sync = () => {
    picker.value = cur.rgb.toLowerCase();
    if (a) a.value = cur.a;
    hex.value = out();
  };
  const emit = () => { sync(); set(out()); };
  picker.addEventListener('input', () => { cur.rgb = picker.value.toUpperCase(); emit(); });
  if (a) a.addEventListener('input', () => { cur.a = Number(a.value); emit(); });
  hex.addEventListener('input', () => {
    if (!/^#?([0-9a-f]{6}|[0-9a-f]{8})$/i.test(hex.value.trim())) return;
    const p = parseColor(hex.value);
    cur.rgb = p.rgb;
    if (alpha) cur.a = p.a;
    picker.value = cur.rgb.toLowerCase();
    if (a) a.value = cur.a;
    set(out());
  });
  sync();
  return field(prop, id, el('div', {class: 'color-row'}, picker, hex, a), alpha);
}

function swatchControl(prop, value, set) {
  const wrap = el('div', {class: 'swatches'});
  let cur = value;
  const paint = () => { for (const b of wrap.children) b.classList.toggle('on', b.dataset.v === cur); };
  for (const o of prop.options) {
    const b = el('button', {type: 'button', class: 'sw', title: o.label, 'aria-label': o.label, 'data-v': o.id});
    b.style.background = GLOW_HEX[o.id] || '#888888';
    b.addEventListener('click', () => { cur = o.id; paint(); set(o.id); });
    wrap.append(b);
  }
  paint();
  return field(prop, '', wrap, true);
}

function materialControl(prop, value, set) {
  const id = 'f' + (++uid);
  const slot = el('button', {class: 'slot-mc', type: 'button', 'aria-label': prop.label});
  const input = el('input', {type: 'text', id, maxlength: prop.max > 0 ? prop.max : false, spellcheck: 'false'});
  input.value = value || '';
  const paint = v => slot.replaceChildren(v ? texEl(String(v).toLowerCase(), 32) : el('span', {class: 'plus', text: '+'}));
  paint(value);
  input.addEventListener('input', () => set(input.value));
  input.addEventListener('change', () => paint(input.value));
  slot.addEventListener('click', async () => {
    const r = await pickMaterial({clear: true});
    if (r == null) return;
    input.value = r;
    paint(r);
    set(r);
  });
  return field(prop, id, el('div', {class: 'row2'}, slot, input), true);
}

function entityOptions() {
  const p = S.schema.kinds.npc.sections.flatMap(s => s.props).find(x => x.id === 'entity-type');
  return p ? p.options : [];
}

function mobGrid(value, onPick) {
  const grid = el('div', {class: 'mobgrid'});
  let cur = value;
  const paint = () => { for (const b of grid.children) b.classList.toggle('on', b.dataset.v === cur); };
  for (const o of entityOptions()) {
    const icon = o.id === 'MANNEQUIN' ? headEl(STEVE, 32) : texEl(entityTex(o.id), 32, true);
    const b = el('button', {type: 'button', class: 'mob', title: o.label, 'data-v': o.id}, icon, el('span', {text: o.label}));
    b.addEventListener('click', () => { cur = o.id; paint(); onPick(o.id); });
    grid.append(b);
  }
  paint();
  return grid;
}

function entityControl(prop, value, set) {
  const grid = mobGrid(value, v => {
    set(v);
    if (S.tab === 'quick' || S.tab === 'appearance') renderBody();
  });
  return field(prop, '', grid, true);
}

function controlFor(prop, value, set) {
  if (prop.id === 'material' && prop.type === 'text') return materialControl(prop, value, set);
  if (prop.id === 'glow-color' && prop.type === 'choice') return swatchControl(prop, value, set);
  if (prop.id === 'entity-type' && prop.type === 'choice') return entityControl(prop, value, set);
  return control(prop, value, set);
}

function pc(id) {
  const p = S.pm[id];
  return p ? controlFor(p, S.props[id], v => setProp(id, v)) : null;
}

function sectionCard(sec, store, setFn, nested) {
  const grid = el('div', {class: 'grid'});
  for (const prop of sec.props) grid.append(controlFor(prop, store[prop.id], v => setFn(prop.id, v)));
  if (nested) return el('div', {}, el('div', {class: 'sub', text: sec.title}), grid);
  return el('section', {class: 'card'}, el('h2', {text: sec.title}), el('div', {class: 'body'}, grid));
}

function groupCard(title, ids) {
  const grid = el('div', {class: 'grid'});
  let n = 0;
  for (const id of ids) {
    const c = pc(id);
    if (c) { grid.append(c); n++; }
  }
  return n ? el('section', {class: 'card'}, el('h2', {text: title}), el('div', {class: 'body'}, grid)) : null;
}

function lineSummary(l) {
  if (l.props.type !== 'TEXT') return l.props.type + ' ' + (l.props.material || '');
  const first = String(l.props.text || '').split(S.cfg.frameSeparator)[0];
  return parseText(first).map(c => c.ch).join('').replace(/\s+/g, ' ').trim() || '(empty)';
}

function lineCard(l, index, rerender) {
  const summary = el('span', {class: 't', text: lineSummary(l)});
  const body = el('div', {class: 'line-body', hidden: !l.open});
  let built = false;
  const build = () => {
    if (built) return;
    built = true;
    for (const sec of S.schema.kinds.line.sections) {
      body.append(sectionCard(sec, l.props, (id, v) => {
        l.props[id] = v;
        touch();
        summary.textContent = lineSummary(l);
        buildPreview();
      }, true));
    }
    if (l.hasItem) body.append(el('p', {class: 'note', text: 'This line has an item set in game. It is kept when you save.'}));
  };
  if (l.open) build();
  const toggle = el('button', {class: 'line-toggle', type: 'button', 'aria-expanded': l.open ? 'true' : 'false', onclick: ev => {
    l.open = !l.open;
    if (l.open) build();
    body.hidden = !l.open;
    ev.currentTarget.setAttribute('aria-expanded', l.open ? 'true' : 'false');
  }}, el('span', {class: 'i', text: '#' + (index + 1)}), summary);
  const move = (d, label, glyph) => el('button', {class: 'btn sm', type: 'button', 'aria-label': label, text: glyph, onclick: () => {
    const j = index + d;
    if (j < 0 || j >= S.lines.length) return;
    [S.lines[index], S.lines[j]] = [S.lines[j], S.lines[index]];
    touch();
    rerender();
    buildPreview();
  }});
  const del = el('button', {class: 'btn sm danger', type: 'button', 'aria-label': 'Delete line', text: 'X', onclick: () => {
    S.lines.splice(index, 1);
    touch();
    rerender();
    buildPreview();
  }});
  return el('div', {class: 'line'}, el('div', {class: 'line-head'}, toggle, move(-1, 'Move up', '↑'), move(1, 'Move down', '↓'), del), body);
}

function addLine(open) {
  if (S.lines.length >= S.cfg.maxLines) return false;
  S.lines.push({ref: -1, props: Object.assign({}, S.cfg.lineDefaults), hasItem: false, open: !!open});
  touch();
  return true;
}

function linesPanel() {
  const list = el('div');
  const count = el('span', {class: 'muted'});

function clonePose(p) {
  const o = {};
  for (const k of LIMBS) o[k] = p[k].slice();
  return o;
}
function defaultPose() { return clonePose(POSE_DEFAULT); }

function parseAnim(text) {
  const frames = [];
  let prev = defaultPose();
  for (const raw of String(text || '').split(/\r?\n/)) {
    const toks = raw.trim().split(/\s+/);
    if (!/^\d+$/.test(toks[0])) continue;
    const limbs = clonePose(prev);
    for (const t of toks.slice(1)) {
      const m = /^(head|body|larm|rarm|lleg|rleg)=([^,]+),([^,]+),([^,]+)$/i.exec(t);
      if (!m) continue;
      const v = [m[2], m[3], m[4]].map(Number);
      if (v.every(Number.isFinite)) limbs[m[1].toLowerCase()] = v;
    }
    frames.push({ticks: clamp(parseInt(toks[0], 10), ANIM_TICK_MIN, ANIM_TICK_MAX), limbs});
    prev = limbs;
    if (frames.length >= ANIM_MAX_FRAMES) break;
  }
  return frames;
}

function serializeAnim(frames) {
  let prev = POSE_DEFAULT;
  return frames.map(f => {
    const parts = [String(f.ticks)];
    for (const k of LIMBS) if (!sameVec(f.limbs[k].map(r1), prev[k].map(r1))) parts.push(k + '=' + f.limbs[k].map(fmtAngle).join(','));
    if (parts.length === 1) parts.push('head=' + f.limbs.head.map(fmtAngle).join(','));
    prev = f.limbs;
    return parts.join(' ');
  }).join('\n');
}

function animTotal(frames) { return frames.reduce((a, f) => a + f.ticks, 0); }

function frameAt(frames, t) {
  const total = animTotal(frames);
  let tt = total > 0 ? ((t % total) + total) % total : 0;
  let i = 0;
  while (i < frames.length - 1 && tt >= frames[i].ticks) { tt -= frames[i].ticks; i++; }
  return {i, f: frames[i] ? tt / frames[i].ticks : 0};
}

function poseAt(frames, t) {
  if (!frames.length) return defaultPose();
  const at = frameAt(frames, t);
  const a = frames[at.i], b = frames[(at.i + 1) % frames.length];
  const out = {};
  for (const k of LIMBS) out[k] = [0, 1, 2].map(j => a.limbs[k][j] + (b.limbs[k][j] - a.limbs[k][j]) * at.f);
  return out;
}

function frameStart(frames, idx) {
  let t = 0;
  for (let i = 0; i < idx && i < frames.length; i++) t += frames[i].ticks;
  return t;
}

function applyPose(skin, pose) {
  for (const k of LIMBS) {
    const part = skin[LIMB_PART[k]];
    const v = pose[k];
    if (part && v) part.rotation.set(v[0] * DEG * POSE_SIGN_X, v[1] * DEG * POSE_SIGN_Y, v[2] * DEG * POSE_SIGN_Z);
  }
}

function animSpeed() { return clamp(num(S.props['animation-speed']) || 1, 0.1, 5); }

function animState() {
  const text = String(S.props.animation || '');
  if (!S.anim) S.anim = {frames: parseAnim(text), src: text, sel: 0, limb: 'rarm', playing: false, loop: true, pos: 0, last: 0, scrub: false, over: false};
  else if (S.anim.src !== text) {
    S.anim.frames = parseAnim(text);
    S.anim.src = text;
    S.anim.sel = clamp(S.anim.sel, 0, Math.max(0, S.anim.frames.length - 1));
  }
  return S.anim;
}

function quickPose() {
  if (!isOn('animation-enabled')) return null;
  const frames = animState().frames;
  if (!frames.length) return null;
  return poseAt(frames, (performance.now() - T0) * TICKS_PER_MS * animSpeed());
}

function npcViewer(opt) {
  const node = el('div', {class: 'nv' + (opt.tall ? ' tall' : '')});
  const canvas = el('canvas');
  const ov = el('canvas', {class: 'ov'});
  const fb = el('img', {class: 'tex fb', alt: '', hidden: true});
  node.append(canvas, ov, fb, el('div', {class: 'cap', text: opt.caption || ''}));
  const st = {viewer: null, lib: null, dead: false, raf: 0, seq: 0, manual: false, hover: null, drag: null, broken: false};

  const screenOf = limb => {
    const part = st.viewer.playerObject.skin[LIMB_PART[limb]];
    if (!part) return null;
    const obj = part.children && part.children[0] ? part.children[0] : part;
    obj.updateWorldMatrix(true, false);
    const p = st.viewer.camera.position.clone();
    obj.getWorldPosition(p);
    const d = st.viewer.camera.position.distanceTo(p) || 1;
    p.project(st.viewer.camera);
    const w = node.clientWidth, h = node.clientHeight;
    return {x: (p.x + 1) / 2 * w, y: (1 - p.y) / 2 * h, px: (h / 2) / Math.tan(st.viewer.camera.fov * Math.PI / 360) / d};
  };

  const pick = (x, y) => {
    if (!st.viewer || st.broken) return null;
    let best = null, bestQ = 1;
    for (const k of LIMBS) {
      const s = screenOf(k);
      if (!s) continue;
      const q = Math.hypot((x - s.x) / (LIMB_PICK[k][0] * s.px), (y - s.y) / (LIMB_PICK[k][1] * s.px));
      if (q <= 1 && q < bestQ) { best = k; bestQ = q; }
    }
    return best;
  };

  const ring = (g, limb, color, width) => {
    const s = screenOf(limb);
    if (!s) return;
    g.strokeStyle = color;
    g.lineWidth = width;
    g.beginPath();
    g.ellipse(s.x, s.y, LIMB_PICK[limb][0] * s.px * 0.9, LIMB_PICK[limb][1] * s.px * 0.9, 0, 0, TAU);
    g.stroke();
  };

  const drawOverlay = () => {
    const g = ov.getContext('2d');
    g.clearRect(0, 0, ov.width, ov.height);
    if (!opt.editable || !st.viewer || st.broken) return;
    const sel = opt.getSel ? opt.getSel() : null;
    if (st.hover && st.hover !== sel) ring(g, st.hover, 'rgba(255,255,255,.45)', 1.5);
    if (sel) {
      g.setLineDash([6, 4]);
      ring(g, sel, ACCENT, 2.5);
      g.setLineDash([]);
      const s = screenOf(sel);
      if (s) {
        g.font = '600 12px ' + FONT_CANVAS;
        g.textAlign = 'center';
        g.fillStyle = '#ffffff';
        g.strokeStyle = '#000000';
        g.lineWidth = 3;
        g.strokeText(LIMB_LABEL[sel], s.x, s.y - LIMB_PICK[sel][1] * s.px * 0.95 - 4);
        g.fillText(LIMB_LABEL[sel], s.x, s.y - LIMB_PICK[sel][1] * s.px * 0.95 - 4);
      }
    }
  };

  const resize = () => {
    const w = node.clientWidth, h = node.clientHeight;
    if (!w || !h) return;
    if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
    if (st.viewer) {
      if (typeof st.viewer.setSize === 'function') st.viewer.setSize(w, h);
      else { st.viewer.width = w; st.viewer.height = h; }
    }
  };
  const ro = 'ResizeObserver' in window ? new ResizeObserver(resize) : null;
  if (ro) ro.observe(node);

  const poseTick = () => {
    if (!st.viewer || st.broken || !st.viewer.playerObject) return;
    const pose = opt.getPose ? opt.getPose() : null;
    if (pose) {
      if (!st.manual) { st.viewer.animation = null; st.manual = true; }
      applyPose(st.viewer.playerObject.skin, pose);
    } else if (st.manual) {
      st.manual = false;
      st.viewer.animation = new st.lib.IdleAnimation();
    }
  };

  const frame = () => {
    if (st.dead) return;
    st.raf = requestAnimationFrame(frame);
    if (!node.isConnected) { destroy(); return; }
    if (document.hidden) return;
    poseTick();
    drawOverlay();
    if (opt.onFrame) opt.onFrame();
  };

  const onMove = ev => {
    if (!st.drag || st.drag.id !== ev.pointerId) return;
    const dx = ev.clientX - st.drag.x, dy = ev.clientY - st.drag.y;
    st.drag.x = ev.clientX;
    st.drag.y = ev.clientY;
    if (opt.onDrag) opt.onDrag(st.drag.limb, dx, dy, ev.shiftKey);
  };
  const onUp = ev => {
    if (!st.drag || st.drag.id !== ev.pointerId) return;
    st.drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    node.style.cursor = '';
  };
  node.addEventListener('pointerdown', ev => {
    if (!opt.editable || ev.button !== 0) return;
    const r = node.getBoundingClientRect();
    const k = pick(ev.clientX - r.left, ev.clientY - r.top);
    if (!k) return;
    ev.stopPropagation();
    ev.preventDefault();
    st.drag = {id: ev.pointerId, x: ev.clientX, y: ev.clientY, limb: k};
    node.style.cursor = 'grabbing';
    if (opt.onPick) opt.onPick(k);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }, true);
  node.addEventListener('pointermove', ev => {
    if (!opt.editable || st.drag || ev.buttons) return;
    const r = node.getBoundingClientRect();
    st.hover = pick(ev.clientX - r.left, ev.clientY - r.top);
    node.style.cursor = st.hover ? 'pointer' : '';
  });
  node.addEventListener('pointerleave', () => { st.hover = null; });

  const showFallback = id => {
    st.broken = true;
    canvas.hidden = true;
    ov.hidden = true;
    fb.hidden = false;
    fb.src = fill(S.assets.body, {id, size: SKIN_H});
  };

  const reload = async () => {
    const my = ++st.seq;
    const id = skinId();
    try {
      const lib = await loadViewerLib();
      if (st.dead || my !== st.seq) return;
      if (!st.viewer) {
        st.lib = lib;
        st.viewer = new lib.SkinViewer({canvas, width: node.clientWidth || 300, height: node.clientHeight || SKIN_H});
        st.viewer.autoRotate = !!opt.autoRotate;
        st.viewer.autoRotateSpeed = 0.6;
        st.viewer.zoom = 0.85;
        if (st.viewer.controls) st.viewer.controls.enablePan = false;
        st.viewer.animation = new lib.IdleAnimation();
        resize();
      }
      let img;
      try { img = await loadCors(fill(S.assets.skin, {id})); } catch (e) { img = await loadCors(fill(S.assets.skin, {id: STEVE})); }
      if (st.dead || my !== st.seq) return;
      await st.viewer.loadSkin(img);
      st.broken = false;
      canvas.hidden = false;
      ov.hidden = false;
      fb.hidden = true;
    } catch (e) {
      if (!st.dead && my === st.seq) showFallback(id);
    }
  };

  const destroy = () => {
    st.dead = true;
    cancelAnimationFrame(st.raf);
    if (ro) ro.disconnect();
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (st.viewer) { try { st.viewer.dispose(); } catch (e) { st.viewer = null; } }
  };

  st.raf = requestAnimationFrame(frame);
  return {node, reload, destroy};
}

function shapePoints(kind) {
  const n = 8, out = [];
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1) - 0.5;
    if (kind === 'RING') { const a = i / n * Math.PI * 2; out.push([Math.cos(a), 0, Math.sin(a)]); }
    else if (kind === 'HELIX') { const a = i * 0.9; out.push([Math.cos(a) * 0.7, -u * 1.6, Math.sin(a) * 0.7]); }
    else if (kind === 'TORNADO') { const a = i * 0.9, r = 0.25 + 0.55 * (0.5 - u); out.push([Math.cos(a) * r, -u * 1.6, Math.sin(a) * r]); }
    else if (kind === 'WHEEL') { const a = i / n * Math.PI * 2; out.push([Math.cos(a), Math.sin(a), 0]); }
    else if (kind === 'SPHERE') { const y = 1 - (i + 0.5) / n * 2, r = Math.sqrt(1 - y * y), a = i * 2.399963; out.push([Math.cos(a) * r, y, Math.sin(a) * r]); }
    else if (kind === 'ROW') out.push([u * 1.8, 0, 0]);
    else out.push([0, -u * 1.6, 0]);
  }
  return out;
}

const shapeCvs = [];
function shapeCanvas(kind) {

function paintShape(s, t) {
  const g = s.c.getContext('2d'), h = SHAPE_PX / 2;
  g.clearRect(0, 0, SHAPE_PX, SHAPE_PX);
  const cs = Math.cos(t), sn = Math.sin(t);
  const pts = s.pts.map((p, i) => {
    const x = p[0] * cs + p[2] * sn, z = -p[0] * sn + p[2] * cs;
    const bob = s.kind === 'STACK' ? Math.sin(t * 2 + i) * 1.5 : 0;
    return {x: h + x * h * 0.7, y: h - p[1] * h * 0.62 + z * h * 0.22 + bob, d: clamp((z + 1) / 2, 0, 1)};
  });
  pts.sort((a, b) => a.d - b.d);
  for (const p of pts) {
    g.fillStyle = mix('#3b62b8', '#dbe8ff', p.d);
    g.fillRect(Math.round(p.x - 5), Math.round(p.y - 2), 10, 4);
  }
}

setInterval(() => {
  if (document.hidden || !shapeCvs.length) return;
  const t = performance.now() * SHAPE_SPIN;
  for (let i = shapeCvs.length - 1; i >= 0; i--) {
    const s = shapeCvs[i];
    if (!s.c.isConnected) { shapeCvs.splice(i, 1); continue; }
    paintShape(s, t);
  }
}, SHAPE_MS);
