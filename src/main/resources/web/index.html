function parseParticle(a, rest, bang) {
  const p = rest.split(/\s+/).filter(Boolean);
  if (!p.length || p.length > 5) return null;
  const parts = p[0].split(':');
  const base = parts[0].toUpperCase();
  if (!/^[A-Z0-9_]+$/.test(base)) return null;
  if (base === 'DUST') {
    if (parts.length < 2 || parts.length > 3 || !HEX6.test(parts[1]) || (parts[2] != null && !isNum(parts[2]))) return null;
    a.c1 = parts[1].toUpperCase();
    if (parts[2] != null) a.size = parts[2];
  } else if (base === 'DUST_TRANSITION') {
    if (parts.length < 3 || parts.length > 4 || !HEX6.test(parts[1]) || !HEX6.test(parts[2]) || (parts[3] != null && !isNum(parts[3]))) return null;
    a.c1 = parts[1].toUpperCase();
    a.c2 = parts[2].toUpperCase();
    if (parts[3] != null) a.size = parts[3];
  } else if (base === 'ITEM' || base === 'BLOCK') {
    if (parts.length !== 2 || !MAT_ANY.test(parts[1])) return null;
    a.mat = parts[1].toLowerCase();
  } else if (parts.length > 1) return null;
  if (p[1] != null) {
    if (!UINT.test(p[1])) return null;
    a.count = p[1];
  }
  if (p[2] != null) {
    if (!ANCHORS.includes(p[2].toLowerCase())) return null;
    a.anchor = p[2].toLowerCase();
  }
  if (p[3] != null) {
    if (!isNum(p[3])) return null;
    a.spread = p[3];
  }
  if (p[4] != null) {
    if (!isNum(p[4])) return null;
    a.speed = p[4];
  }
  a.ptype = base;
  a.everyone = bang;
  return a;
}

function parseAction(s) {
  const raw = {t: 'raw', src: s};
  const sp = s.search(/\s/);
  const verb = sp < 0 ? s : s.slice(0, sp);
  const rest = sp < 0 ? '' : s.slice(sp).trim();
  const bang = verb.endsWith('!');
  const name = verb.replace(/!$/, '').toLowerCase();
  if (!ACT_IDS.has(name) || (bang && name !== 'particle' && name !== 'sound')) return raw;
  const a = newAction(name);
  a.src = s;
  switch (name) {
    case 'particle': return parseParticle(a, rest, bang) || raw;
    case 'sound': {
      const p = rest.split(/\s+/).filter(Boolean);
      if (!p.length || p.length > 3 || !p.slice(1).every(isNum)) return raw;
      a.everyone = bang;
      a.key = p[0];
      if (p[1] != null) a.vol = p[1];
      if (p[2] != null) a.pitch = p[2];
      return a;
    }
    case 'message':
    case 'actionbar':
    case 'console':
    case 'player':
      a.text = rest;
      return a;
    case 'title': {
      const i = rest.indexOf('|');
      a.title = i < 0 ? rest : rest.slice(0, i);
      a.sub = i < 0 ? '' : rest.slice(i + 1);
      return a;
    }
    case 'swing':
    case 'glow':
    case 'animate': {
      const v = rest.toLowerCase();
      if (name === 'swing' && !v) return a;
      if (!ACT_MODES[name].includes(v)) return raw;
      a.mode = v;
      return a;
    }
    case 'item':
      if (!rest || /\s/.test(rest)) return raw;
      a.mat = rest.toLowerCase() === 'none' ? '' : rest.toLowerCase();
      return a;
    default:
      return rest ? raw : a;
  }
}

function parseRule(line) {
  const raw = {raw: line};
  const i = line.indexOf('->');
  if (i < 0) return raw;
  const left = line.slice(0, i).trim().split(/\s+/).filter(Boolean);
  const ev = EV[(left[0] || '').toLowerCase()];
  if (!ev) return raw;
  const r = {ev: ev.id, arg: '', every: '', cooldown: '', actions: [], src: line, dirty: false};
  let k = 1;
  if (ev.arg) {
    const v = left[k++];
    if (v == null) return raw;
    if (ev.arg === 'int' ? !UINT.test(v) || Number(v) < 1 : !MAT_ANY.test(v)) return raw;
    r.arg = ev.arg === 'int' ? v : v.toLowerCase();
  }
  while (k < left.length) {
    const key = left[k].toLowerCase();
    const v = left[k + 1];
    if ((key !== 'every' && key !== 'cooldown') || v == null || !UINT.test(v) || r[key] !== '') return raw;
    r[key] = v;
    k += 2;
  }
  r.actions = line.slice(i + 2).split(';').map(s => s.trim()).filter(Boolean).map(parseAction);
  return r;
}

function parseTriggers(text) {
  const out = [];
  for (const line of String(text || '').split(/\r?\n/)) {
    const t = line.trim();
    if (!t) continue;
    out.push(t.startsWith('#') ? {raw: t} : parseRule(t));
  }
  return out;
}

function ruleText(r) {
  if (r.raw != null) return r.raw;
  if (!r.dirty) return r.src;
  const left = [r.ev];
  if (EV[r.ev].arg) left.push(r.arg);
  if (r.every !== '') left.push('every', r.every);
  if (r.cooldown !== '') left.push('cooldown', r.cooldown);
  return left.join(' ') + ' -> ' + r.actions.map(actText).join('; ');
}

function nfield(label, value, attrs, set) {
  const id = 'f' + (++uid);
  const i = el('input', Object.assign({type: 'number', id}, attrs));
  i.value = value;
  i.addEventListener('input', () => set(i.value));
  return el('div', {class: 'field'}, el('label', {for: id, text: label}), i);
}

function tfield(T, label, value, set, attrs) {
  const id = 'f' + (++uid);
  const i = el('input', Object.assign({type: 'text', id, spellcheck: 'false', autocomplete: 'off'}, attrs || {}));
  i.value = value;
  i.addEventListener('input', () => set(i.value));
  i.addEventListener('focus', () => { T.focus = i; });
  return el('div', {class: 'field wide'}, el('label', {for: id, text: label}), i);
}

function sfield(label, opts, value, set, wide) {
  const id = 'f' + (++uid);
  const s = el('select', {id}, opts.map(o => el('option', {value: o[0], text: o[1]})));
  s.value = value;
  if (s.value !== value && value) {
    s.append(el('option', {value, text: value}));
    s.value = value;
  }
  s.addEventListener('change', () => set(s.value));
  return el('div', {class: 'field' + (wide ? ' wide' : '')}, el('label', {for: id, text: label}), s);
}

function nf(label, type, min, max, step, value, set) {
  return control({label, type, min, max, step}, value, set);
}

function listOps(arr, i, done) {
  const mv = (d, glyph, label) => el('button', {class: 'btn sm', type: 'button', 'aria-label': label, text: glyph, onclick: () => {
    const j = i + d;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    done();
  }});
  const del = el('button', {class: 'btn sm danger', type: 'button', 'aria-label': 'Remove', text: 'X', onclick: () => { arr.splice(i, 1); done(); }});
  return [mv(-1, '↑', 'Move up'), mv(1, '↓', 'Move down'), del];
}

function particleFields(T, a, mark, paint) {
  const kinds = DATA_PARTICLES.map(k => [k, DATA_LABEL[k]]).concat(PARTICLES.map(p => [p, pretty(p)]), [[OTHER, 'Other...']]);
  const custom = a.custom || !KNOWN_PARTICLES.has(a.ptype);
  const out = [sfield('Particle', kinds, custom ? OTHER : a.ptype, v => {
    if (v === OTHER) {
      a.custom = true;
      if (KNOWN_PARTICLES.has(a.ptype)) a.ptype = '';
    } else {
      a.custom = false;
      a.ptype = v;
    }
    mark();
    paint();
  }, true)];
  if (custom) out.push(tfield(T, 'Particle name', a.ptype, v => { a.ptype = v.trim().toUpperCase(); mark(); }, {placeholder: 'CHERRY_LEAVES'}));
  const dust = a.ptype === 'DUST' || a.ptype === 'DUST_TRANSITION';
  if (dust) out.push(colorControl({label: a.ptype === 'DUST' ? 'Color' : 'From color'}, 'f' + (++uid), a.c1, v => { a.c1 = v; mark(); }));
  if (a.ptype === 'DUST_TRANSITION') out.push(colorControl({label: 'To color'}, 'f' + (++uid), a.c2, v => { a.c2 = v; mark(); }));
  if (dust) out.push(nf('Size', 'number', 0.1, 4, 0.1, a.size, v => { a.size = v; mark(); }));
  if (a.ptype === 'ITEM' || a.ptype === 'BLOCK') out.push(materialControl({label: a.ptype === 'ITEM' ? 'Item' : 'Block', id: 'material', type: 'text', max: 64}, a.mat, v => { a.mat = v.trim().toLowerCase(); mark(); }));
  out.push(
    nf('Count', 'integer', 1, 200, 1, a.count, v => { a.count = v; mark(); }),
    sfield('Anchor', ANCHORS.map(x => [x, ANCHOR_LABEL[x]]), a.anchor, v => { a.anchor = v; mark(); }),
    nf('Spread', 'number', 0, 5, 0.05, a.spread, v => { a.spread = v; mark(); }),
    nf('Speed', 'number', 0, 2, 0.01, a.speed, v => { a.speed = v; mark(); }),
    control({label: 'Visible to everyone', type: 'bool'}, String(a.everyone), v => { a.everyone = v === 'true'; mark(); }));
  return out;
}

function actionFields(T, a, mark, paint) {
  switch (a.t) {
    case 'particle': return particleFields(T, a, mark, paint);
    case 'sound': return [
      tfield(T, 'Sound key', a.key, v => { a.key = v.replace(/\s+/g, ''); mark(); }, {list: 'nxSounds', placeholder: 'entity.player.levelup'}),
      nf('Volume', 'number', 0, 4, 0.05, a.vol, v => { a.vol = v; mark(); }),
      nf('Pitch', 'number', 0.5, 2, 0.05, a.pitch, v => { a.pitch = v; mark(); }),
      control({label: 'Audible to everyone', type: 'bool'}, String(a.everyone), v => { a.everyone = v === 'true'; mark(); })];
    case 'message':
    case 'actionbar': return [tfield(T, a.t === 'message' ? 'Chat message' : 'Action bar text', a.text, v => { a.text = v; mark(); })];
    case 'title': return [
      tfield(T, 'Title', a.title, v => { a.title = v.replace(/\|/g, ''); mark(); }),
      tfield(T, 'Subtitle', a.sub, v => { a.sub = v; mark(); })];
    case 'console':
    case 'player': return [tfield(T, a.t === 'console' ? 'Console command' : 'Command run as the player', a.text, v => { a.text = v; mark(); }, {placeholder: 'without the leading /'})];
    case 'swing':
    case 'glow':
    case 'animate': return [sfield(pretty(a.t), ACT_MODE_LABELS[a.t], a.mode, v => { a.mode = v; mark(); }, true)];
    case 'item': return [materialControl({label: 'Item (empty = nothing)', id: 'material', type: 'text', max: 64}, a.mat, v => { a.mat = v.trim().toLowerCase(); mark(); })];
    case 'raw': return [tfield(T, 'Unrecognised action, kept exactly as written', a.src, v => { a.src = v; mark(); })];
    default: return [el('p', {class: 'note', text: 'No options.'})];
  }
}

function actionRow(T, r, a, j, render, commit) {
  const mark = () => {
    r.dirty = true;
    if (a.t !== 'raw') a.src = null;
    commit();
  };
  const done = () => {
    r.dirty = true;
    commit();
    render();
  };
  const body = el('div', {class: 'arow-b'});
  const paint = () => body.replaceChildren(...actionFields(T, a, mark, paint));
  paint();
  let label;
  if (a.t === 'raw') label = el('span', {class: 'grow muted', text: 'Raw action'});
  else {
    const typeSel = el('select', {'aria-label': 'Action type'}, ACTIONS.map(x => el('option', {value: x[0], text: x[1]})));
    typeSel.value = a.t;
    typeSel.addEventListener('change', () => {
      r.actions[j] = newAction(typeSel.value);
      done();
    });
    label = el('div', {class: 'grow'}, typeSel);
  }
  const rows = [el('div', {class: 'arow-h'}, label, listOps(r.actions, j, done)), body];
  if (PLAYER_ONLY.has(a.t) && EV[r.ev].scope === 'npc') rows.push(el('p', {class: 'note warn', text: 'This action only runs for player events (click, look, approach, leave, becomes visible).'}));
  return el('div', {class: 'arow'}, rows);
}

function ruleCard(T, r, i, render, commit) {
  const done = () => {
    commit();
    render();
  };
  const ops = listOps(T.rules, i, done);
  if (r.raw != null) {
    const comment = r.raw.startsWith('#');
    const inp = el('input', {type: 'text', spellcheck: 'false', 'aria-label': 'Raw line'});
    inp.value = r.raw;
    inp.addEventListener('input', () => { r.raw = inp.value; commit(); });
    return el('div', {class: 'rule raw'},
      el('div', {class: 'rule-h'}, svgIcon(comment ? EV_ICO.note : EV_ICO.raw, 22, 'ev-ico'), el('span', {class: 'grow muted', text: comment ? 'Comment' : 'Unrecognised line, kept exactly as written'}), ops),
      el('div', {class: 'rule-p'}, el('div', {class: 'field wide'}, inp)));
  }
  const ev = EV[r.ev];
  const mark = () => {
    r.dirty = true;
    commit();
  };
  const evSel = el('select', {'aria-label': 'Event'}, EVENTS.map(e => el('option', {value: e.id, text: e.label})));
  evSel.value = r.ev;
  evSel.addEventListener('change', () => {
    const next = EV[evSel.value];
    const keep = ev.arg && ev.arg === next.arg;
    r.ev = next.id;
    r.arg = next.arg ? (keep ? r.arg : DEF_ARG[next.id]) : '';
    r.dirty = true;
    done();
  });
  const dup = el('button', {class: 'btn sm', type: 'button', 'aria-label': 'Duplicate rule', text: 'Copy', onclick: () => {
    const c = JSON.parse(JSON.stringify(r));
    c.dirty = true;
    T.rules.splice(i + 1, 0, c);
    done();
  }});
  const params = el('div', {class: 'rule-p'});
  if (ev.arg === 'material') params.append(materialControl({label: 'Item', id: 'material', type: 'text', max: 64}, r.arg, v => { r.arg = v.trim().toLowerCase(); mark(); }));
  if (ev.arg === 'int') params.append(nfield(ev.id === 'frame' ? 'Frame number (1-based)' : 'Interval (ticks)', r.arg, {min: 1, step: 1}, v => {
    if (UINT.test(v) && Number(v) >= 1) { r.arg = v; mark(); }
  }));
  const opt = key => v => {
    if (v === '') { r[key] = ''; mark(); } else if (UINT.test(v)) { r[key] = v; mark(); }
  };
  if (ev.every || r.every !== '') params.append(nfield('Every (ticks)', r.every, {min: 1, step: 1, placeholder: '20'}, opt('every')));
  params.append(nfield('Cooldown (ticks)', r.cooldown, {min: 0, step: 1, placeholder: ev.scope === 'player' ? 'default' : '0'}, opt('cooldown')));
  const notes = [el('p', {class: 'note', style: 'margin:0', text: ev.hint + (ev.scope === 'player' ? ' Runs per player.' : ' Runs for everyone who can see the NPC.')})];
  if (ev.arg && !r.arg) notes.push(el('p', {class: 'note warn', style: 'margin:0', text: 'This event needs a value or the rule is skipped.'}));
  if (!r.actions.length) notes.push(el('p', {class: 'note warn', style: 'margin:0', text: 'Add at least one action.'}));
  const acts = el('div', {class: 'acts'}, r.actions.map((a, j) => actionRow(T, r, a, j, render, commit)));
  const addSel = el('select', {'aria-label': 'New action type'}, ACTIONS.map(x => el('option', {value: x[0], text: x[1]})));
  const add = el('div', {class: 'tbar'}, addSel, el('button', {class: 'btn sm primary', type: 'button', text: '+ Add action', onclick: () => {
    r.actions.push(newAction(addSel.value));
    r.dirty = true;
    done();
  }}));
  return el('div', {class: 'rule'},
    el('div', {class: 'rule-h'}, svgIcon(EV_ICO[ev.id], 24, 'ev-ico'), el('div', {class: 'grow'}, evSel), ops, dup),
    params,
    el('div', {class: 'rule-n'}, notes),
    acts,
    el('div', {class: 'acts'}, add));
}

function bodyTriggers() {
  const root = el('div');
  if (!S.pm.triggers) {
    root.append(el('div', {class: 'empty', text: 'This server has no trigger support.'}));
    return root;
  }
  const T = {rules: parseTriggers(S.props.triggers), focus: null};
  const max = S.pm.triggers.max > 0 ? S.pm.triggers.max : ANIM_TEXT_MAX;
  const count = el('span', {class: 'muted'});
  const list = el('div');
  const showCount = text => {
    count.textContent = text.length + ' / ' + max + ' chars';
    count.classList.toggle('warn', text.length > max);
  };
  const commit = () => {
    const text = T.rules.map(ruleText).join('\n');
    showCount(text);
    if (text.length <= max) setProp('triggers', text);
  };
  const render = () => {
    list.replaceChildren(...T.rules.map((r, i) => ruleCard(T, r, i, render, commit)));
    if (!T.rules.length) list.append(el('div', {class: 'empty', text: 'No rules yet. Pick a starter recipe below or add a rule.'}));
  };
  const insert = text => {
    const i = T.focus;
    if (!i || !i.isConnected) { toast('Click a text field first, then a placeholder', 'err'); return; }
    const s = i.selectionStart == null ? i.value.length : i.selectionStart;
    const e = i.selectionEnd == null ? s : i.selectionEnd;
    i.value = i.value.slice(0, s) + text + i.value.slice(e);
    i.dispatchEvent(new Event('input'));
    i.focus();
    i.setSelectionRange(s + text.length, s + text.length);
  };
  const ranges = el('div', {class: 'grid'});
  for (const id of ['look-trigger-range', 'approach-range']) {
    const c = pc(id);
    if (c) ranges.append(c);
  }
  root.append(el('section', {class: 'card'}, el('h2', {text: 'Ranges'}), el('div', {class: 'body'}, ranges,
    el('p', {class: 'note', text: 'Looking at the NPC counts when you are inside the look range and your crosshair is close enough to it' + (S.cfg.lookAngle != null ? ' (within ' + num(S.cfg.lookAngle) + ' degrees, a server setting).' : '.')}))));
  const chips = el('div', {class: 'modechips'}, PH_CHIPS.map(c => el('button', {type: 'button', class: 'chip', text: c, onmousedown: ev => ev.preventDefault(), onclick: () => insert(c)})));
  const evSel = el('select', {'aria-label': 'New rule event'}, EVENTS.map(e => el('option', {value: e.id, text: e.label})));
  const addRule = el('button', {class: 'btn sm primary', type: 'button', text: '+ New rule', onclick: () => {
    const id = evSel.value;
    T.rules.push({ev: id, arg: DEF_ARG[id] || '', every: '', cooldown: '', actions: [newAction('particle')], src: '', dirty: true});
    commit();
    render();
  }});
  root.append(el('section', {class: 'card'}, el('h2', {}, el('span', {text: 'Rules'}), count),
    el('div', {class: 'body'},
      el('div', {class: 'sub', style: 'margin-top:0', text: 'PLACEHOLDERS (click a text field first)'}), chips,
      el('div', {style: 'margin-top:10px'}, list),
      el('div', {class: 'tbar'}, evSel, addRule),
      el('p', {class: 'note', text: 'Rules save automatically. Lines the builder does not understand are kept exactly as written. Use ; only to separate actions.'}))));
  root.append(el('section', {class: 'card'}, el('h2', {text: 'Starter recipes'}), el('div', {class: 'body'}, el('div', {class: 'cards'}, RECIPES.map(rc => pcard(rc.label, rc.hint, svgIcon(EV_ICO[rc.icon], 30), false, () => {
    T.rules.push(parseRule(rc.text));
    commit();
    render();
    toast('Rule added', 'ok');
  }))))));
  showCount(String(S.props.triggers || ''));
  render();
  return root;
}

function npId() { return S.cur.id + (S.cfg.nameplateSuffix || ''); }

function adoptNp(d, owner) {
  const props = S.schema.kinds.hologram.sections.flatMap(s => s.props);
  const pm = Object.fromEntries(props.map(p => [p.id, p]));
  const pr = {};
  for (const [k, v] of Object.entries(d.props || {})) if (pm[k]) pr[k] = v;
  S.np = {
    owner,
    cur: {kind: 'hologram', id: d.id, world: d.world, x: d.x, y: d.y, z: d.z, yaw: d.yaw},
    pm,
    props: pr,
    lines: (d.lines || []).map((l, i) => ({ref: i, props: Object.assign({}, l.props), hasItem: !!l.hasItem, open: false})),
    pending: false
  };
}

async function loadNp(tries, delay) {
  if (!S.cur || S.cur.kind !== 'npc') return false;
  const owner = S.cur.id;
  const id = npId();
  for (let i = 0; i < tries; i++) {
    try {
      const d = await api('/api/object', {kind: 'hologram', id});
      if (!S.cur || S.cur.id !== owner) return false;
      if (!(S.np && S.np.pending && S.np.owner === owner)) adoptNp(d, owner);
      trackAttached(d);
      if (!S.objects.some(o => o.kind === 'hologram' && o.id === id)) refreshList().catch(() => {});
      return true;
    } catch (e) {
      if (i < tries - 1) await new Promise(res => setTimeout(res, delay));
    }
  }
  return false;
}

function ensurePlate() {
  if (S.cur && S.cur.kind === 'npc' && isOn('nameplate') && !plateModel()) loadNp(1, 0);
}

function npEditor() {
  const n = S.np;
  const root = el('div');
  root.append(el('div', {class: 'actions', style: 'margin-bottom:12px;align-items:center'},
    el('span', {class: 'muted grow', text: 'Editing hologram ' + n.cur.id}),
    el('button', {class: 'btn sm', type: 'button', text: 'Open as hologram', onclick: () => selectObj('hologram', n.cur.id, {center: true})})));
  root.append(pvCard(), lookCard(), quickLines());
  const grid = el('div', {class: 'grid'});
  for (const id of ['line-spacing', 'view-range']) {
    if (n.pm[id]) grid.append(controlFor(n.pm[id], n.props[id], v => { n.props[id] = v; touchNp(); buildPreview(); }));
  }
  if (grid.children.length) root.append(el('section', {class: 'card'}, el('h2', {text: 'Spacing'}), el('div', {class: 'body'}, grid)));
  return root;
}

function bodyNameplate() {
  const root = el('div');
  if (!S.pm.nameplate) {
    root.append(el('div', {class: 'empty', text: 'This server has no nameplate support.'}));
    return root;
  }
  const host = el('div');
  let seq = 0;
  const note = (text, retry) => el('div', {class: 'hintbox'}, el('span', {text}), retry ? el('button', {class: 'btn primary', type: 'button', text: 'Retry', onclick: retry}) : null);
  const fill = async () => {
    const my = ++seq;
    if (!isOn('nameplate')) {
      host.replaceChildren(note('Turn the nameplate on to float your own hologram lines above this NPC. The NPC name tag is hidden while it is on.'));
      return;
    }
    if (!plateModel()) {
      host.replaceChildren(note('Preparing nameplate hologram ' + npId() + '...'));
      await flushAll();
      const ok = await loadNp(NP_TRIES, NP_RETRY_MS);
      if (my !== seq || !host.isConnected || S.tab !== 'nameplate') return;
      if (!ok) {
        host.replaceChildren(note('The nameplate hologram is not available yet.', fill));
        return;
      }
    }
    host.replaceChildren(npEditor());
  };
  const fields = el('div', {class: 'grid'}, control(S.pm.nameplate, S.props.nameplate, v => { setProp('nameplate', v); fill(); }), pc('nameplate-height'));
  root.append(el('section', {class: 'card'}, el('h2', {text: 'Hologram nameplate'}), el('div', {class: 'body'}, fields,
    el('p', {class: 'note', text: 'The nameplate is a hologram attached to this NPC. It follows the NPC when it walks and shows above its head. Height is in blocks above the head.'}))));
  root.append(host);
  fill();
  return root;
}

function renderBody() {
  if (S.skin) { S.skin.destroy(); S.skin = null; }
  if (S.scene) { S.scene.destroy(); S.scene = null; }
  const body = $('#inspBody');
  const top = body.scrollTop;
  body.replaceChildren();
  $('#app').classList.toggle('wide', !!S.cur && (S.wide || (S.cur.kind === 'npc' && (S.tab === 'animate' || S.tab === 'triggers'))));
  if (!S.cur) {
    body.append(el('div', {class: 'empty', text: 'Click an icon on the map or pick an object from the list. Use + New to create one at your position.'}));
    return;
  }
  const tabs = TABS[S.cur.kind];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'quick';
  const k = S.cur.kind;
  let node;
  if (S.tab === 'quick') node = k === 'npc' ? bodyQuickNpc() : bodyQuickHolo();
  else if (S.tab === 'animate') node = bodyAnimate();
  else if (S.tab === 'triggers') node = bodyTriggers();
  else if (S.tab === 'nameplate') node = bodyNameplate();
  else if (S.tab === 'movement') node = k === 'npc' ? bodyMoveNpc() : bodyMoveHolo();
  else if (S.tab === 'appearance') node = bodyAppearance();
  else if (S.tab === 'advanced') node = bodyAdvanced();
  else node = bodyLines();
  body.append(node);
  body.scrollTop = top;
  syncDrawUI();
  updateUndoUI();
  if (k === 'hologram') buildPreview();
}

function renderTabs() {
  const t = $('#inspTabs');
  t.replaceChildren();

  for (const [id, label] of TABS[S.cur.kind]) {

function renderHeader() {

function renderInspector() {

function closeOrDeselect() {

function openInsp() { $('#insp').classList.add('open'); }
function closeInsp() { $('#insp').classList.remove('open'); }
function closeSide() { $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }

async function run(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, 'err'); } finally { btn.disabled = false; }
}

function adopt(data) {
  S.cur = {kind: data.kind, id: data.id, world: data.world, x: data.x, y: data.y, z: data.z, yaw: data.yaw, waypoints: data.waypoints, equipment: data.equipment, skinId: data.skinId, entityType: data.entityType};
  const props = S.schema.kinds[data.kind].sections.flatMap(s => s.props);
  S.pm = Object.fromEntries(props.map(p => [p.id, p]));
  S.props = {};
  for (const [k, v] of Object.entries(data.props || {})) if (S.pm[k]) S.props[k] = v;
  S.lines = (data.lines || []).map((l, i) => ({ref: i, props: Object.assign({}, l.props), hasItem: !!l.hasItem, open: false}));
  S.path = parsePath(data.waypointList);
  S.anim = null;
  S.pending = false;
  S.pathPending = false;
  if (!(S.np && S.np.pending)) S.np = null;
  if (data.kind === 'hologram') trackAttached(data);
}

async function reloadCurrent() {
  const data = await api('/api/object', ref());
  const open = S.lines.map(l => l.open);
  adopt(data);
  S.lines.forEach((l, i) => { l.open = !!open[i]; });
  renderInspector();
  redraw();
}

async function selectObj(kind, id, opt) {
  const o = opt || {};
  try {
    await flushAll();
    const data = await api('/api/object', {kind, id});
    adopt(data);
    S.undo = [];
    S.drawing = false;
    S.ui.shape = null;
    T0 = performance.now();
    const worldChanged = data.world !== view.world;
    view.world = data.world;
    if (o.center || worldChanged) centerOn(data.x, data.z);
    refreshWorldSel();
    setInd('saved');
    renderInspector();
    renderList();
    openInsp();
    closeSide();
    syncDrawUI();
    redraw();
    scheduleEnsure();
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function deselect() {
  try { await flushAll(); } catch (e) { toast(e.message, 'err'); }
  S.cur = null;
  S.path = [];
  S.undo = [];
  S.drawing = false;
  renderInspector();
  renderList();
  syncDrawUI();
  redraw();
}

async function moveHere() {
  await flushAll();
  await api('/api/movehere', ref());
  const d = await api('/api/object', ref());
  Object.assign(S.cur, {world: d.world, x: d.x, y: d.y, z: d.z, waypoints: d.waypoints});
  S.path = parsePath(d.waypointList);
  await refreshList();
  view.world = d.world;
  centerOn(d.x, d.z);
  refreshWorldSel();
  renderHeader();

}

async function deleteCur() {
  if (!confirm('Delete ' + S.cur.id + '? This cannot be undone.')) return;
  clearTimeout(saveTimer);
  clearTimeout(pathTimer);
  clearTimeout(npTimer);
  S.pending = false;
  S.pathPending = false;
  S.np = null;
  await api('/api/delete', ref());
  S.cur = null;
  S.path = [];
  S.undo = [];
  S.drawing = false;
  renderInspector();
  syncDrawUI();
  await refreshList();
  setInd('saved');
  toast('Deleted', 'ok');
}

async function refreshList() {

function refreshWorldSel() {
  const sel = $('#worldSel');
  const worlds = new Set(S.objects.map(o => o.world));

const cv = $('#map');
const ctx = cv.getContext('2d');
const view = {world: null, cx: 0, cz: 0, s: SCALE_DEF};
const tiles = new Map();
const tq = [];
let tActive = 0;
let W = 0;
let H = 0;
let dpr = 1;
let raf = 0;
let drag = null;
let pinch = null;
let hoverObj = null;
let lastTerrainErr = 0;
const ptrs = new Map();

const sx = x => (x - view.cx) * view.s + W / 2;
const sz = z => (z - view.cz) * view.s + H / 2;
const wx = px => (px - W / 2) / view.s + view.cx;
const wz = py => (py - H / 2) / view.s + view.cz;

function redraw() {
  if (raf) return;
  raf = requestAnimationFrame(draw);
}

function resizeMap() {
  const r = cv.parentElement.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = r.width;
  H = r.height;
  cv.width = Math.max(1, Math.round(W * dpr));
  cv.height = Math.max(1, Math.round(H * dpr));
  redraw();
  scheduleEnsure();
}

function centerOn(x, z) {
  view.cx = x;
  view.cz = z;
  redraw();
  scheduleEnsure();
}

function zoomAt(px, py, f) {
  const ax = wx(px), az = wz(py);
  view.s = clamp(view.s * f, SCALE_MIN, SCALE_MAX);
  view.cx = ax - (px - W / 2) / view.s;
  view.cz = az - (py - H / 2) / view.s;
  redraw();
  scheduleEnsure();
}

const scheduleEnsure = debounce(() => ensureTiles(), ENSURE_MS);

function tileKey(world, gx, gz) { return world + '|' + gx + '|' + gz; }

function ensureTiles() {
  if (!view.world || !W || !S.assets) return;
  const gx0 = Math.floor(wx(0) / TILE), gx1 = Math.floor(wx(W) / TILE);
  const gz0 = Math.floor(wz(0) / TILE), gz1 = Math.floor(wz(H) / TILE);
  if ((gx1 - gx0 + 1) * (gz1 - gz0 + 1) > TILE_MAX_VISIBLE) return;
  const now = Date.now();
  const need = [];
  const ccx = view.cx / TILE - 0.5, ccz = view.cz / TILE - 0.5;
  for (let gz = gz0; gz <= gz1; gz++) {
    for (let gx = gx0; gx <= gx1; gx++) {
      const key = tileKey(view.world, gx, gz);
      const t = tiles.get(key);
      if (t && t.loading) continue;
      const stale = !t || (t.state === 'fail' && now - t.fail > TILE_RETRY) || (t.state === 'ok' && now - t.ts > TILE_TTL);
      if (stale) need.push({world: view.world, gx, gz, key, d: Math.hypot(gx - ccx, gz - ccz)});
    }
  }
  need.sort((a, b) => a.d - b.d);
  for (const j of need.slice(0, TILE_FETCH_LIMIT)) {
    let t = tiles.get(j.key);
    if (!t) { t = {state: 'new', canvas: null, ts: 0, fail: 0, loading: true, x0: 0, z0: 0, size: 0, heights: null}; tiles.set(j.key, t); }
    else t.loading = true;
    tq.push(j);
  }
  pumpTiles();
}

function jobVisible(j) {
  if (j.world !== view.world) return false;
  const gx0 = Math.floor(wx(0) / TILE), gx1 = Math.floor(wx(W) / TILE);
  const gz0 = Math.floor(wz(0) / TILE), gz1 = Math.floor(wz(H) / TILE);
  return j.gx >= gx0 && j.gx <= gx1 && j.gz >= gz0 && j.gz <= gz1;
}

function pumpTiles() {
  while (tActive < TILE_CONC && tq.length) {
    const j = tq.shift();
    if (!jobVisible(j)) {
      const t = tiles.get(j.key);
      if (t) { t.loading = false; if (t.state === 'new') tiles.delete(j.key); }
      continue;
    }
    tActive++;
    loadTile(j).finally(() => { tActive--; pumpTiles(); });
  }
}

async function loadTile(j) {
  const t = tiles.get(j.key);
  if (!t) return;
  try {
    const r = await api('/api/terrain', {world: j.world, x: j.gx * TILE + TILE / 2, z: j.gz * TILE + TILE / 2, radius: TILE_RADIUS});
    t.canvas = renderTile(r);
    t.x0 = r.x0;
    t.z0 = r.z0;
    t.size = r.size;
    t.heights = r.heights;
    t.state = 'ok';
    t.ts = Date.now();
  } catch (e) {
    t.state = t.canvas ? 'ok' : 'fail';
    t.fail = Date.now();
    if (!t.canvas && Date.now() - lastTerrainErr > 10000) { lastTerrainErr = Date.now(); toast('Terrain: ' + e.message, 'err'); }
  }
  t.loading = false;
  redraw();
}

function shadeFor(df) {
  if (df > 1) return 1.16;
  if (df > 0) return 1.08;
  if (df < -1) return 0.7;
  if (df < 0) return 0.85;
  return 1;
}

function renderTile(r) {
  const n = r.size;
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  const im = g.createImageData(n, n);
  const d = im.data;
  for (let z = 0; z < n; z++) {
    for (let x = 0; x < n; x++) {
      const i = z * n + x, col = r.colors[i], o = i * 4;
      if (col <= 0) continue;
      let f = 1;
      const h = r.heights[i];
      if (z > 0 && h !== NO_H) {
        const hn = r.heights[i - n];
        if (hn !== NO_H) f = shadeFor(h - hn);
      }
      d[o] = clamp(((col >> 16) & 255) * f, 0, 255);
      d[o + 1] = clamp(((col >> 8) & 255) * f, 0, 255);
      d[o + 2] = clamp((col & 255) * f, 0, 255);
      d[o + 3] = 255;
    }
  }
  g.putImageData(im, 0, 0);
  return c;
}

function groundY(x, z) {
  const gx = Math.floor(x / TILE), gz = Math.floor(z / TILE);
  const t = tiles.get(tileKey(view.world, gx, gz));
  const fb = S.cur ? S.cur.y : 0;
  if (!t || !t.heights) return fb;
  const dx = Math.floor(x) - t.x0, dz = Math.floor(z) - t.z0;
  if (dx < 0 || dz < 0 || dx >= t.size || dz >= t.size) return fb;
  const h = t.heights[dz * t.size + dx];
  if (h === NO_H) return fb;
  return Math.abs(h + 1 - fb) <= GROUND_SLOP ? h + 1 : fb;
}

function trackAttached(data) {
  const a = String((data.props || {})['attach-to'] || '').trim();
  if (a && S.objects.some(o => o.kind === 'npc' && o.id === a)) S.attached.add(data.id);
  else S.attached.delete(data.id);
}

function isPlate(o) {
  if (o.kind !== 'hologram') return false;
  if (S.attached.has(o.id)) return true;
  const suf = S.cfg && S.cfg.nameplateSuffix;
  if (!suf || o.id.length <= suf.length || !o.id.endsWith(suf)) return false;
  const base = o.id.slice(0, -suf.length);
  return S.objects.some(n => n.kind === 'npc' && n.id === base);
}

function viewObjs() {
  const list = S.objects.filter(o => o.world === view.world && (isSel(o) || !isPlate(o)));
  const sel = S.cur ? list.findIndex(o => o.kind === S.cur.kind && o.id === S.cur.id) : -1;
  if (sel >= 0) list.push(list.splice(sel, 1)[0]);
  return list;
}

function isSel(o) { return !!S.cur && o.kind === S.cur.kind && o.id === S.cur.id; }

function objPos(o) {
  if (drag && drag.type === 'obj' && drag.o === o && drag.moved) return drag.pos;
  return {x: o.x, z: o.z};
}

function curVisible() { return !!S.cur && S.cur.world === view.world; }

function pathGeom() {
  const pts = S.path.map(p => ({x: sx(p[0]), y: sz(p[2])}));
  const mids = [];
  const n = pts.length;
  if (n >= 2) {
    const segs = n === 2 ? 1 : n;
    for (let i = 0; i < segs; i++) {
      const a = S.path[i], b = S.path[(i + 1) % n];
      const wxm = (a[0] + b[0]) / 2, wzm = (a[2] + b[2]) / 2;
      mids.push({x: sx(wxm), y: sz(wzm), i, wx: wxm, wz: wzm, wy: (a[1] + b[1]) / 2});
    }
  }
  return {pts, mids};
}

function draw() {
  raf = 0;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0d1017';
  ctx.fillRect(0, 0, W, H);
  drawTiles();
  drawGrid();
  const objs = viewObjs();
  for (const o of objs) if (!isSel(o)) drawObj(o, false);
  drawPath();
  for (const o of objs) if (isSel(o)) drawObj(o, true);
  drawPlayer();
}

function drawTiles() {
  if (!view.world) return;
  ctx.imageSmoothingEnabled = false;
  for (const [key, t] of tiles) {
    if (!t.canvas || !key.startsWith(view.world + '|')) continue;
    const x = Math.floor(sx(t.x0)), z = Math.floor(sz(t.z0));
    const w = Math.ceil(sx(t.x0 + t.size)) - x, h = Math.ceil(sz(t.z0 + t.size)) - z;
    if (x > W || z > H || x + w < 0 || z + h < 0) continue;
    ctx.drawImage(t.canvas, x, z, w, h);
  }
}

function drawGrid() {
  if (view.s < 4) return;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath();
  for (let x = Math.floor(wx(0) / 16) * 16; x <= wx(W); x += 16) {
    const px = Math.round(sx(x)) + 0.5;
    ctx.moveTo(px, 0);
    ctx.lineTo(px, H);
  }
  for (let z = Math.floor(wz(0) / 16) * 16; z <= wz(H); z += 16) {
    const py = Math.round(sz(z)) + 0.5;
    ctx.moveTo(0, py);
    ctx.lineTo(W, py);
  }
  ctx.stroke();
}

function plate(x, y, s, sel) {
  const h = s / 2;
  ctx.fillStyle = '#161b28';
  ctx.fillRect(x - h, y - h, s, s);
  ctx.lineWidth = 2;
  ctx.strokeStyle = sel ? ACCENT : '#000000cc';
  ctx.strokeRect(x - h + 1, y - h + 1, s - 2, s - 2);
  ctx.strokeStyle = sel ? '#dbe8ff' : '#ffffff40';
  ctx.beginPath();
  ctx.moveTo(x - h + 1, y + h - 1);
  ctx.lineTo(x - h + 1, y - h + 1);
  ctx.lineTo(x + h - 1, y - h + 1);
  ctx.stroke();
}

function drawObj(o, sel) {
  const p = objPos(o);
  const x = sx(p.x), y = sz(p.z);
  if (x < -40 || x > W + 40 || y < -40 || y > H + 40) return;
  const s = sel ? ICON + 6 : ICON, h = s / 2;
  ctx.save();
  if (o.kind === 'npc') {
    plate(x, y, s, sel);
    const inner = s - 8;
    if (isPlayerType(o.entityType)) {
      const e = headNow(o.skinId);
      if (e) { ctx.imageSmoothingEnabled = true; ctx.drawImage(e.img, x - inner / 2, y - inner / 2, inner, inner); }
    } else {
      const e = texNow(entityTex(o.entityType));
      if (e) { ctx.imageSmoothingEnabled = false; ctx.drawImage(e.img, x - inner / 2, y - inner / 2, inner, inner); }
    }
    if (sel) drawFacing(x, y, h, o.yaw);
  } else {
    ctx.shadowColor = ACCENT;
    ctx.shadowBlur = sel ? 20 : 11;
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x + h * 0.8, y);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x - h * 0.8, y);
    ctx.closePath();
    const gr = ctx.createLinearGradient(x, y - h, x, y + h);
    gr.addColorStop(0, '#cfe6ff');
    gr.addColorStop(0.5, ACCENT);
    gr.addColorStop(1, '#2a4a9a');
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = sel ? 2 : 1.5;
    ctx.strokeStyle = sel ? '#ffffff' : '#ffffffb0';
    ctx.stroke();
    ctx.fillStyle = '#ffffffd0';
    ctx.fillRect(x - h * 0.34, y - 3, h * 0.68, 2);
    ctx.fillRect(x - h * 0.24, y + 1, h * 0.48, 2);
  }
  ctx.restore();
  if (sel || view.s >= LABEL_MIN_SCALE || hoverObj === o) label(o.id, x, y + h + 12);
}

function drawFacing(x, y, h, yaw) {
  if (yaw == null) return;
  const r = num(yaw) * Math.PI / 180;
  const a = Math.atan2(Math.cos(r), -Math.sin(r));
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.fillStyle = ACCENT;
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(h + 8, 0);
  ctx.lineTo(h + 1, -5);
  ctx.lineTo(h + 1, 5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function label(text, x, y) {
  ctx.font = '12px ' + FONT_CANVAS;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#000000d0';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x, y);
}

function drawPath() {
  if (!curVisible() || !S.path.length) return;
  const g = pathGeom();
  const n = g.pts.length;
  if (n >= 2) {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (const pass of [0, 1]) {
      ctx.lineWidth = pass ? 3 : 6;
      ctx.strokeStyle = pass ? ACCENT : '#000000a0';
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(g.pts[0].x, g.pts[0].y);
      for (let i = 1; i < n; i++) ctx.lineTo(g.pts[i].x, g.pts[i].y);
      ctx.stroke();
      if (n > 2) {
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(g.pts[n - 1].x, g.pts[n - 1].y);
        ctx.lineTo(g.pts[0].x, g.pts[0].y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  if (!S.drawing) {
    for (const m of g.mids) {
      ctx.fillStyle = '#1b2c57';
      ctx.fillRect(m.x - 8, m.y - 8, 16, 16);
      ctx.strokeStyle = '#8fb2ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(m.x - 7, m.y - 7, 14, 14);
      ctx.beginPath();
      ctx.moveTo(m.x - 4, m.y);
      ctx.lineTo(m.x + 4, m.y);
      ctx.moveTo(m.x, m.y - 4);
      ctx.lineTo(m.x, m.y + 4);
      ctx.stroke();
    }
  }
  ctx.font = '12px ' + FONT_CANVAS;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  g.pts.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? '#3b62b8' : '#161b28';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#8fb2ff';
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(i + 1), p.x, p.y + 1);
  });
}

function drawPlayer() {
  const m = S.me;
  if (!m || !m.online || m.world !== view.world) return;
  const x = sx(m.x), y = sz(m.z);
  if (x < -30 || x > W + 30 || y < -30 || y > H + 30) return;
  const r = num(m.yaw) * Math.PI / 180;
  const a = Math.atan2(Math.cos(r), -Math.sin(r));
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.fill();
  ctx.rotate(a);
  ctx.beginPath();
  ctx.moveTo(11, 0);
  ctx.lineTo(-7, -7);
  ctx.lineTo(-3, 0);
  ctx.lineTo(-7, 7);
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#000000';
  ctx.stroke();
  ctx.restore();
}

function hit(px, py) {
  if (curVisible() && S.path.length) {
    const g = pathGeom();
    for (let i = g.pts.length - 1; i >= 0; i--) if (Math.hypot(g.pts[i].x - px, g.pts[i].y - py) <= HIT_NODE) return {t: 'node', i};
    if (!S.drawing) for (const m of g.mids) if (Math.hypot(m.x - px, m.y - py) <= HIT_MID) return {t: 'mid', m};
  }
  const objs = viewObjs();
  for (let k = objs.length - 1; k >= 0; k--) {
    const o = objs[k], q = objPos(o);
    if (Math.hypot(sx(q.x) - px, sz(q.z) - py) <= HIT_OBJ) return {t: 'obj', o};
  }
  return null;
}

function pt(ev) {
  const r = cv.getBoundingClientRect();
  return {x: ev.clientX - r.left, y: ev.clientY - r.top};
}

function updateCoords(p) {
  const x = Math.floor(wx(p.x)), z = Math.floor(wz(p.y));
  $('#coordBar').textContent = 'x ' + x + '  z ' + z + '  chunk ' + (x >> 4) + ', ' + (z >> 4);
}

function updateHover(p) {
  const h = hit(p.x, p.y);
  const next = h && h.t === 'obj' ? h.o : null;
  let cur = S.drawing ? 'crosshair' : 'default';
  if (h) cur = h.t === 'node' ? 'grab' : h.t === 'mid' ? 'copy' : (isSel(h.o) ? 'move' : 'pointer');
  cv.style.cursor = cur;
  if (next !== hoverObj) { hoverObj = next; redraw(); }
}

function deleteNode(i) {
  if (i < 0 || i >= S.path.length) return;
  pushUndo();
  S.path.splice(i, 1);
  S.ui.shape = null;
  syncPathUI();
  schedulePathSave();
  if (S.tab === 'movement') renderBody();
  if (navigator.vibrate) navigator.vibrate(20);
}

function appendPoint(x, z) {
  pushUndo();
  S.path.push([r2(x), groundY(x, z), r2(z)]);
  S.ui.shape = null;
  syncPathUI();
  schedulePathSave();
}

async function commitMove(o, pos) {
  const prev = {x: o.x, z: o.z};
  o.x = pos.x;
  o.z = pos.z;
  if (isSel(o)) { S.cur.x = o.x; S.cur.z = o.z; renderHeader(); }
  redraw();
  try {
    await api('/api/move', {kind: o.kind, id: o.id, x: r2(pos.x), y: o.y, z: r2(pos.z)});
  } catch (e) {
    o.x = prev.x;
    o.z = prev.z;
    if (isSel(o)) { S.cur.x = prev.x; S.cur.z = prev.z; renderHeader(); }
    toast(e.message, 'err');
    redraw();
  }
}

function startPinch() {
  const [a, b] = Array.from(ptrs.values());
  const mid = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
  pinch = {d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: view.s, ax: wx(mid.x), az: wz(mid.y)};
}

function doPinch() {
  const [a, b] = Array.from(ptrs.values());
  const mid = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
  view.s = clamp(pinch.s0 * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0), SCALE_MIN, SCALE_MAX);
  view.cx = pinch.ax - (mid.x - W / 2) / view.s;
  view.cz = pinch.az - (mid.y - H / 2) / view.s;
  redraw();
  scheduleEnsure();
}

function cancelDrag() {
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.type === 'node' && drag.moved) schedulePathSave();
  drag = null;
}

function bindMap() {
  cv.addEventListener('pointerdown', ev => {
    if (ev.button === 2) return;
    cv.setPointerCapture(ev.pointerId);
    const p = pt(ev);
    ptrs.set(ev.pointerId, p);
    if (ptrs.size === 2) { cancelDrag(); startPinch(); return; }
    if (ptrs.size > 2) return;
    const h = hit(p.x, p.y);
    drag = {id: ev.pointerId, x: p.x, y: p.y, cx: view.cx, cz: view.cz, moved: false, type: 'pan', timer: 0};
    if (h && h.t === 'node') {
      drag.type = 'node';
      drag.i = h.i;
      drag.snap = cloneProps();
      drag.timer = setTimeout(() => {
        if (!drag || drag.moved || drag.type !== 'node') return;
        const i = drag.i;
        drag = null;
        deleteNode(i);
      }, LONGPRESS);
    } else if (h && h.t === 'mid') {
      pushUndo();
      S.path.splice(h.m.i + 1, 0, [h.m.wx, h.m.wy, h.m.wz]);
      S.ui.shape = null;
      drag.type = 'node';
      drag.i = h.m.i + 1;
      drag.inserted = true;
      drag.snap = null;
    } else if (h && h.t === 'obj') {
      drag.o = h.o;
      if (isSel(h.o)) {
        drag.type = 'obj';
        drag.ox = wx(p.x) - h.o.x;
        drag.oz = wz(p.y) - h.o.z;
        drag.pos = {x: h.o.x, z: h.o.z};
      } else {
        drag.type = 'tap';
      }
    }
    redraw();
  });

  cv.addEventListener('pointermove', ev => {
    const p = pt(ev);
    if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, p);
    updateCoords(p);
    if (pinch && ptrs.size === 2) { doPinch(); return; }
    if (!drag || drag.id !== ev.pointerId) { if (!ptrs.size) updateHover(p); return; }
    const dx = p.x - drag.x, dy = p.y - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > MOVE_SLOP) {
      drag.moved = true;
      clearTimeout(drag.timer);
      if (drag.type === 'tap') drag.type = 'pan';
      if (drag.type === 'node' && drag.snap) pushUndo(drag.snap);
    }
    if (!drag.moved) return;
    if (drag.type === 'pan') {
      view.cx = drag.cx - dx / view.s;
      view.cz = drag.cz - dy / view.s;
      scheduleEnsure();
    } else if (drag.type === 'obj') {
      drag.pos = {x: wx(p.x) - drag.ox, z: wz(p.y) - drag.oz};
    } else if (drag.type === 'node') {
      const n = S.path[drag.i];
      if (n) { n[0] = wx(p.x); n[2] = wz(p.y); }
    }
    redraw();
  });

  const finish = ev => {
    const had = ptrs.delete(ev.pointerId);
    if (pinch) { if (ptrs.size < 2) pinch = null; drag = null; return; }
    const d = drag;
    if (!d || d.id !== ev.pointerId || !had) return;
    drag = null;
    clearTimeout(d.timer);
    const p = pt(ev);
    if (d.type === 'obj' && d.moved) commitMove(d.o, d.pos);
    else if (d.type === 'tap' && !d.moved) selectObj(d.o.kind, d.o.id);
    else if (d.type === 'node' && (d.moved || d.inserted)) { syncPathUI(); schedulePathSave(); if (S.tab === 'movement') renderBody(); }
    else if (d.type === 'pan' && !d.moved && S.drawing && S.cur) appendPoint(wx(p.x), wz(p.y));
    redraw();
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', ev => { ptrs.delete(ev.pointerId); cancelDrag(); pinch = null; redraw(); });
  cv.addEventListener('pointerleave', () => { if (hoverObj) { hoverObj = null; redraw(); } });
  cv.addEventListener('contextmenu', ev => {
    ev.preventDefault();
    if (drag && drag.type === 'node') { clearTimeout(drag.timer); drag = null; }
    const p = pt(ev);
    const h = hit(p.x, p.y);
    if (h && h.t === 'node') deleteNode(h.i);
  });
  cv.addEventListener('wheel', ev => {
    ev.preventDefault();
    const p = pt(ev);
    const dy = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
    zoomAt(p.x, p.y, Math.exp(-dy * WHEEL_K));
  }, {passive: false});
  if ('ResizeObserver' in window) new ResizeObserver(resizeMap).observe(cv.parentElement);
  else window.addEventListener('resize', resizeMap);
}

async function pollMe() {
  if (document.hidden || !$('#gate').hidden) return;
  try { S.me = await api('/api/me'); } catch (e) { return; }
  $('#locP').disabled = !(S.me && S.me.online);
  redraw();
}

function openNew() {
  const kind = S.filter === 'npc' ? 'npc' : 'hologram';
  setNewKind(kind);
  $('#newId').value = suggestId(kind);
  $('#newDlg').showModal();
  $('#newId').focus();
  $('#newId').select();
}

function suggestId(kind) {
  let n = 1;
  while (S.objects.some(o => o.kind === kind && o.id === kind + '_' + n)) n++;
  return kind + '_' + n;
}

let newType = null;
function setNewKind(kind) {
  $('#newDlg').dataset.kind = kind;
  for (const b of $('#newKind').children) b.classList.toggle('on', b.dataset.k === kind);
  $('#newTypeWrap').hidden = kind !== 'npc';
  if (kind === 'npc') {
    newType = S.cfg.defaultNpcType;
    $('#newMob').replaceChildren(mobGrid(newType, v => { newType = v; }));
  }
  const cur = $('#newId').value;
  if (!cur || /^(hologram|npc)_\d+$/.test(cur)) $('#newId').value = suggestId(kind);
}

async function submitNew() {
  const id = $('#newId').value.trim();
  const kind = $('#newDlg').dataset.kind || 'hologram';
  let ok = true;
  try { ok = new RegExp('^(?:' + S.cfg.idPattern + ')$').test(id); } catch (e) { ok = id.length > 0; }
  if (!ok) { toast('Invalid id', 'err'); return; }
  const body = {kind, id};
  if (kind === 'npc') body.entityType = newType;
  await run($('#newOk'), async () => {
    await flushAll();
    await api('/api/create', body);
    $('#newDlg').close();
    await refreshList();
    toast('Created', 'ok');
    await selectObj(kind, id, {center: true});
  });
}

function bind() {
  bindMap();
  bindPicker();
  document.body.append(el('datalist', {id: 'nxSounds'}, SOUNDS.map(s => el('option', {value: s}))));
  $('#search').addEventListener('input', ev => { S.search = ev.target.value; renderList(); });
  $('#refreshBtn').addEventListener('click', ev => run(ev.currentTarget, refreshList));
  $('#menuBtn').addEventListener('click', () => { $('#side').classList.add('open'); $('#scrim').classList.add('on'); });
  $('#inspToggle').addEventListener('click', () => $('#insp').classList.toggle('open'));
  $('#scrim').addEventListener('click', closeSide);
  $('#newBtn').addEventListener('click', openNew);
  $('#newCancel').addEventListener('click', () => $('#newDlg').close());
  $('#newForm').addEventListener('submit', ev => { ev.preventDefault(); submitNew(); });
  $('#newKind').addEventListener('click', ev => { const b = ev.target.closest('[data-k]'); if (b) setNewKind(b.dataset.k); });
  $('#zIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.4));
  $('#zOut').addEventListener('click', () => zoomAt(W / 2, H / 2, 1 / 1.4));
  $('#locP').addEventListener('click', () => {
    if (!S.me || !S.me.online) return;
    view.world = S.me.world;
    refreshWorldSel();
    centerOn(S.me.x, S.me.z);
  });
  $('#locO').addEventListener('click', () => {
    if (!S.cur) return;
    view.world = S.cur.world;
    refreshWorldSel();
    centerOn(S.cur.x, S.cur.z);
  });
  $('#refT').addEventListener('click', () => {
    tiles.clear();
    tq.length = 0;
    redraw();
    ensureTiles();
  });
  $('#worldSel').addEventListener('change', ev => {
    view.world = ev.target.value;
    if (S.me && S.me.online && S.me.world === view.world) centerOn(S.me.x, S.me.z);
    else {
      const o = S.objects.find(x => x.world === view.world);
      if (o) centerOn(o.x, o.z);
    }
    redraw();
  });
  $('#mapDraw').addEventListener('click', toggleDraw);
  $('#mapUndo').addEventListener('click', undoPath);
  document.addEventListener('keydown', ev => {
    const typing = ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') {
      ev.preventDefault();
      if (S.cur) flushAll().then(() => { if (!busy()) toast('Saved', 'ok'); }, e => toast(e.message, 'err'));
      return;
    }
    if (typing) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undoPath(); return; }
    if (ev.key === 'Escape') {
      if (S.drawing) { S.drawing = false; syncDrawUI(); } else if (S.cur) deselect();
    }
  });
  window.addEventListener('beforeunload', ev => { if (busy()) { ev.preventDefault(); ev.returnValue = ''; } });
}

function initView() {
  const m = S.me;
  if (m && m.online) { view.world = m.world; view.cx = m.x; view.cz = m.z; }
  else if (S.objects.length) { const o = S.objects[0]; view.world = o.world; view.cx = o.x; view.cz = o.z; }
  refreshWorldSel();
}

async function boot() {
  bind();
  if (!token) { gate(); return; }
  try {
    const schema = await api('/api/schema');
    S.schema = schema;
    S.cfg = schema.config;
    S.assets = S.cfg.assets || {};
    loadFont();
    await Promise.all([refreshList(), pollMe()]);
    initView();
    renderInspector();
    renderList();
    syncDrawUI();
    setInd('saved');
    resizeMap();
    setInterval(pollMe, ME_MS);
  } catch (e) {
    if (!$('#gate').hidden) return;
    toast(e.message, 'err');
  }
}

boot();
})();
</script>
</body>
