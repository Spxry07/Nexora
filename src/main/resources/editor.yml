      pose-right-arm: {label: "&f&lRight Arm (x,y,z °)", type: text, max: 32}
      pose-left-arm: {label: "&f&lLeft Arm (x,y,z °)", type: text, max: 32}
      pose-right-leg: {label: "&f&lRight Leg (x,y,z °)", type: text, max: 32}
      pose-left-leg: {label: "&f&lLeft Leg (x,y,z °)", type: text, max: 32}
      animation:
