      actions: {label: "&f&lClick Actions ([player] /shop, [console], [message] ...)", type: multiline, max: 2048}
      click-type:
        label: "&f&lClick Type"
        type: choice
        options: {ANY: "Any", RIGHT: "Right click", LEFT: "Left click"}
      cooldown: {label: "&f&lCooldown (ticks)", type: integer, min: 0, max: 12000, step: 1}
      animation-speed: {label: "&f&lAnimation Speed", type: number, min: 0.1, max: 5, step: 0.1}
      pose-head: {label: "&f&lHead (x,y,z °)", type: text, max: 32}
