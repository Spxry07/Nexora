        properties: [scale, scale-x, scale-y, scale-z, offset-x, offset-y, offset-z, rot-x, rot-y, rot-z, billboard, item-transform]
      style:
        title: "&#6293F0&lStyle"
        properties: [background-default, background, shadow, see-through, alignment, line-width, opacity]
      glow:
        title: "&#6293F0&lGlow & Light"
        properties: [glow, glow-color, brightness]
    properties:
      type:
        label: "&f&lLine Type"
        type: choice
        options: {TEXT: "Text", ITEM: "Item", BLOCK: "Block", SHAPE: "Shape"}
      text: {label: "&f&lText (frames split by ||)", type: multiline, max: 1024}
      material: {label: "&f&lMaterial (item/block lines)", type: text, max: 64}
      frame-interval: {label: "&f&lFrame Interval (ticks)", type: integer, min: 1, max: 200, step: 1}
      shape:
        label: "&f&lShape (shape lines)"
        type: choice
        options: {TRIANGLE: "Triangle", RIGHT_TRIANGLE: "Right triangle", SQUARE: "Square", DIAMOND: "Diamond", POLYGON: "Polygon", CIRCLE: "Circle", STAR: "Star", HEART: "Heart", CROSS: "Cross", ARROW: "Arrow", CUBE: "Cube (3D)", PYRAMID: "Pyramid (3D)", PRISM: "Prism (3D)", OCTAHEDRON: "Octahedron (3D)", CYLINDER: "Cylinder (3D)", CONE: "Cone (3D)"}
      shape-style:
        label: "&f&lShape Style"
        type: choice
        options: {FILL: "Filled", OUTLINE: "Outline"}
      shape-sides: {label: "&f&lSides / Star Points", type: integer, min: 3, max: 32, step: 1}
      shape-inner: {label: "&f&lStar Inner Size", type: number, min: 0.05, max: 0.95, step: 0.05}
      shape-thickness: {label: "&f&lOutline Thickness", type: number, min: 0.01, max: 0.5, step: 0.01}
      effect:
        label: "&f&lEffect"
        type: choice
        options: {NONE: "None", SOLID: "Solid color (A)", FLICKER: "Flicker (A/B)", FADE: "Fade (A↔B)", TYPEWRITER: "Typewriter", RAINBOW: "Rainbow", WAVE: "Gradient Wave", SCROLL: "Scroll", BLINK: "Blink"}
      effect-speed: {label: "&f&lEffect Speed (ticks/step)", type: integer, min: 1, max: 100, step: 1}
      color-a: {label: "&f&lColor A", type: color}
      color-b: {label: "&f&lColor B", type: color}
      scroll-width: {label: "&f&lScroll Width", type: integer, min: 4, max: 64, step: 1}
      scale: {label: "&f&lScale", type: number, min: 0.1, max: 10, step: 0.05}
      scale-x: {label: "&f&lWidth ×", type: number, min: 0.05, max: 10, step: 0.05}
      scale-y: {label: "&f&lHeight ×", type: number, min: 0.05, max: 10, step: 0.05}
      scale-z: {label: "&f&lDepth ×", type: number, min: 0.05, max: 10, step: 0.05}
      offset-y: {label: "&f&lY Offset", type: number, min: -5, max: 5, step: 0.05}
      offset-x: {label: "&f&lx Offset", type: number, min: -10, max: 10, step: 0.05}
      offset-z: {label: "&f&lZ Offset", type: number, min: -10, max: 10, step: 0.05}
      rot-x: {label: "&f&lTilt x (°, -90 = Flat On Ground)", type: number, min: -180, max: 180, step: 5}
      rot-y: {label: "&f&lTurn Y (°)", type: number, min: -180, max: 180, step: 5}
      rot-z: {label: "&f&lRoll Z (°)", type: number, min: -180, max: 180, step: 5}
      billboard:
        label: "&f&lBillboard"
        type: choice
        options: {CENTER: "Face player", VERTICAL: "Vertical", HORIZONTAL: "Horizontal", FIXED: "Fixed"}
      item-transform:
        label: "&f&lItem Transform"
        type: choice
        options: {FIXED: "Fixed", GROUND: "Ground", GUI: "GUI", HEAD: "Head", NONE: "None", THIRDPERSON_RIGHTHAND: "Third person", FIRSTPERSON_RIGHTHAND: "First person"}
      background-default: {label: "&f&lDefault Background", type: bool}
      background: {label: "&f&lBackground (#AARRGGBB)", type: color}
      shadow: {label: "&f&lText Shadow", type: bool}
      see-through: {label: "&f&lSee Through Blocks", type: bool}
      alignment:
        label: "&f&lAlignment"
        type: choice
        options: {CENTER: "Center", LEFT: "Left", RIGHT: "Right"}
      line-width: {label: "&f&lMax Line Width", type: integer, min: 20, max: 1000, step: 10}
      opacity: {label: "&f&lText Opacity", type: integer, min: 30, max: 255, step: 5}
      glow: {label: "&f&lGlow Outline", type: bool}
      glow-color: {label: "&f&lGlow Color", type: color}
      brightness: {label: "&f&lBrightness (-1 = world)", type: integer, min: -1, max: 15, step: 1}

  npc:
