          yellow: "Yellow"
          green: "Green"
          dark_green: "Dark Green"
          aqua: "Aqua"
          dark_aqua: "Dark Aqua"
          blue: "Blue"
          dark_blue: "Dark Blue"
          light_purple: "Pink"
          dark_purple: "Purple"
      scale: {label: "&f&lScale", type: number, min: 0.1, max: 5, step: 0.05}
      look-at: {label: "&f&lLook At Players", type: bool}
