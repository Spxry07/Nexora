        title: "&#6293F0&lIdentity"
        properties: [entity-type, name, name-visible, description]
      skin:
        title: "&#6293F0&lSkin"
        properties: [skin-name, skin-value, skin-signature]
      appearance:
        title: "&#6293F0&lAppearance"
        properties: [pose, glow, glow-color, scale]
      behaviour:
        title: "&#6293F0&lBehaviour"
        properties: [look-at, look-range, spin-speed, path-speed, view-range]
      animations:
        title: "&#6293F0&lAnimations"
        properties: [swing-interval, sneak-interval, hurt-interval]
      animation:
        title: "&#6293F0&lAnimation Preset"
        properties: [animation, animation-speed, keyframes]
      pose:
        title: "&#6293F0&lPose (Skinned Model)"
        properties: [pose-head, pose-body, pose-right-arm, pose-left-arm, pose-right-leg, pose-left-leg]
      triggers:
        title: "&#6293F0&lTriggers & Effects"
        properties: [triggers, look-trigger-range, approach-range]
      nameplate:
