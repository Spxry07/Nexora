file-version: 10
kinds:
  hologram:
    sections:
      general:
        title: "&#6293F0&lGeneral"
        properties: [view-range, line-spacing, attach-to, attach-height]
      shape:
        title: "&#6293F0&lShape"
        properties: [layout, layout-radius, shape-width, shape-height, shape-tilt, shape-sides, shape-inner, grid-columns, arc-angle, layout-speed, helix-step, wave-height, wave-speed]
      interaction:
        title: "&#6293F0&lInteraction"
        properties: [clickable, hitbox-width, hitbox-height, hitbox-offset-y, actions, click-type, cooldown, triggers, approach-range, look-trigger-range]
      reactive:
        title: "&#6293F0&lReactive Motion"
        properties: [face-player, follow-player, follow-range, follow-distance, follow-speed, proximity-scale, proximity-range]
      motion:
        title: "&#6293F0&lMotion"
        properties: [spin-speed, bob-height, bob-speed, orbit-radius, orbit-speed]
      effects:
        title: "&#6293F0&lTransform Effects"
        properties: [pulse-amount, pulse-speed, sway-angle, sway-speed]
      path:
        title: "&#6293F0&lPath"
        properties: [path-speed]
      particles:
        title: "&#6293F0&lParticles"
        properties: [particle, particle-count, particle-radius, particle-interval]
    properties:
      view-range: {label: "&f&lView Range", type: number, min: 4, max: 160, step: 1}
      line-spacing: {label: "&f&lLine Spacing", type: number, min: 0.05, max: 2, step: 0.05}
      attach-to: {label: "&f&lFollow NPC (id)", type: text, max: 32}
      attach-height: {label: "&f&lHeight Above NPC", type: number, min: -2, max: 6, step: 0.05}
      layout:
        label: "&f&lLayout"
        type: choice
        options: {STACK: "Stack (classic)", RING: "Ring (carousel)", HELIX: "Helix (spiral)", ROW: "Row (side by side)", WHEEL: "Wheel (vertical ring)", SPHERE: "Sphere (globe)", TORNADO: "Tornado (cone spiral)", TRIANGLE: "Triangle", SQUARE: "Square", POLYGON: "Polygon (N sides)", STAR: "Star", HEART: "Heart", GRID: "Grid", ARC: "Arc", SPIRAL: "Flat spiral", CUBE: "Cube", INFINITY: "Infinity loop", DIAMOND: "Diamond", PYRAMID: "Pyramid", CROSS: "Cross"}
      layout-radius: {label: "&f&lShape Size (Radius)", type: number, min: 0, max: 20, step: 0.1}
      shape-width: {label: "&f&lShape Width ×", type: number, min: 0.1, max: 5, step: 0.05}
      shape-height: {label: "&f&lShape Height ×", type: number, min: 0.1, max: 5, step: 0.05}
      shape-tilt: {label: "&f&lShape Tilt (0 = Flat, 90 = Standing)", type: number, min: -90, max: 90, step: 5}
      shape-sides: {label: "&f&lSides / Star Points", type: integer, min: 3, max: 16, step: 1}
      shape-inner: {label: "&f&lStar Inner Radius ×", type: number, min: 0.1, max: 1, step: 0.05}
      grid-columns: {label: "&f&lGrid Columns", type: integer, min: 1, max: 16, step: 1}
      arc-angle: {label: "&f&lArc Angle (°)", type: number, min: 10, max: 360, step: 5}
      clickable: {label: "&f&lClickable", type: bool}
      hitbox-width: {label: "&f&lHitbox Width", type: number, min: 0.1, max: 10, step: 0.1}
      hitbox-height: {label: "&f&lHitbox Height", type: number, min: 0.1, max: 10, step: 0.1}
      hitbox-offset-y: {label: "&f&lHitbox Height Offset", type: number, min: -5, max: 5, step: 0.05}
      actions: {label: "&f&lClick Actions ([player] /shop, [console], [message] ...)", type: multiline, max: 2048}
      click-type:
        label: "&f&lClick Type"
        type: choice
        options: {ANY: "Any", RIGHT: "Right click", LEFT: "Left click"}
      cooldown: {label: "&f&lCooldown (ticks)", type: integer, min: 0, max: 12000, step: 1}
      triggers: {label: "&f&lTriggers (event -> action; action)", type: multiline, max: 8192}
      approach-range: {label: "&f&lApproach Range", type: number, min: 1, max: 32, step: 0.5}
      look-trigger-range: {label: "&f&lLook Trigger Range", type: number, min: 1, max: 32, step: 0.5}
      face-player: {label: "&f&lTurn Toward Nearest Player", type: bool}
      follow-player: {label: "&f&lFollow Nearest Player", type: bool}
      follow-range: {label: "&f&lFollow Range", type: number, min: 1, max: 48, step: 0.5}
      follow-distance: {label: "&f&lKeep Distance", type: number, min: 0.5, max: 16, step: 0.25}
      follow-speed: {label: "&f&lFollow Speed (blocks/s)", type: number, min: 0.1, max: 20, step: 0.1}
      proximity-scale: {label: "&f&lGrow When Near (+×)", type: number, min: 0, max: 3, step: 0.05}
      proximity-range: {label: "&f&lGrow Range", type: number, min: 1, max: 32, step: 0.5}
      layout-speed: {label: "&f&lLayout Rotation (°/s)", type: number, min: -720, max: 720, step: 5}
      helix-step: {label: "&f&lHelix / Tornado Turn Per Line (°)", type: number, min: 0, max: 180, step: 5}
      wave-height: {label: "&f&lLine Wave Height", type: number, min: 0, max: 2, step: 0.05}
      wave-speed: {label: "&f&lLine Wave Speed (cycles/s)", type: number, min: 0, max: 5, step: 0.05}
      spin-speed: {label: "&f&lSpin Speed (°/s)", type: number, min: -720, max: 720, step: 5}
      bob-height: {label: "&f&lBob Height", type: number, min: 0, max: 3, step: 0.05}
      bob-speed: {label: "&f&lBob Speed (cycles/s)", type: number, min: 0, max: 5, step: 0.05}
      orbit-radius: {label: "&f&lOrbit Radius", type: number, min: 0, max: 10, step: 0.1}
      orbit-speed: {label: "&f&lOrbit Speed (cycles/s)", type: number, min: -5, max: 5, step: 0.05}
      pulse-amount: {label: "&f&lPulse Amount", type: number, min: 0, max: 1, step: 0.05}
      pulse-speed: {label: "&f&lPulse Speed (cycles/s)", type: number, min: 0, max: 5, step: 0.05}
      sway-angle: {label: "&f&lSway Angle (°)", type: number, min: 0, max: 90, step: 1}
      sway-speed: {label: "&f&lSway Speed (cycles/s)", type: number, min: 0, max: 5, step: 0.05}
      path-speed: {label: "&f&lPath Speed (blocks/s)", type: number, min: 0, max: 20, step: 0.1}
      particle: &particles
        label: "&f&lParticle"
        type: choice
        options:
          NONE: "None"
          FLAME: "Flame"
          SOUL_FIRE_FLAME: "Soul Flame"
          END_ROD: "End Rod"
          HEART: "Heart"
          NOTE: "Note"
          PORTAL: "Portal"
          ENCHANT: "Enchant"
          HAPPY_VILLAGER: "Happy Villager"
          CLOUD: "Cloud"
          SNOWFLAKE: "Snowflake"
          TOTEM_OF_UNDYING: "Totem"
          ELECTRIC_SPARK: "Electric Spark"
          GLOW: "Glow"
          CRIT: "Crit"
          SOUL: "Soul"
          FIREWORK: "Firework"
          WAX_ON: "Wax"
          NAUTILUS: "Nautilus"
          WITCH: "Witch"
      particle-count: &particle-count {label: "&f&lParticle Count", type: integer, min: 0, max: 50, step: 1}
      particle-radius: &particle-radius {label: "&f&lParticle Radius", type: number, min: 0, max: 5, step: 0.1}
      particle-interval: &particle-interval {label: "&f&lParticle Interval (ticks)", type: integer, min: 0, max: 200, step: 1}

  line:
    sections:
      content:
        title: "&#6293F0&lContent"
        properties: [type, text, material, frame-interval, shape, shape-style, shape-sides, shape-inner, shape-thickness]
      effect:
        title: "&#6293F0&lText Effect"
        properties: [effect, effect-speed, color-a, color-b, scroll-width]
      transform:
