      description: "&7Levitating blocks"
      view-range: 64
      skin-name: ""
      skin-value: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzkyOGNlM2Y2YzY0NTE2ZGI2MDY5ODUwM2EwMGM2MDBlNzVhOWVhM2M1NmNlZjA4ODM4OWZiNjQ3YTI2OGRmYyJ9fX0="
