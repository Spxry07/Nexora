file-version: 5
id-prefix: "demo-"
skin-property: "textures"
objects:
  title:
    kind: hologram
    offset: {forward: 16, right: 0, up: 3.0, yaw: 180}
    props:
      line-spacing: 0.4
      bob-height: 0.08
      bob-speed: 0.3
      view-range: 64
      particle: "ELECTRIC_SPARK"
      particle-count: 3
      particle-radius: 2.2
      particle-interval: 6
    lines:
      - {type: "TEXT", text: "&lNEXORA", effect: "RAINBOW", effect-speed: 2, scale: 2.2, offset-y: 0.35, background-default: false}
      - {type: "TEXT", text: "&lᴘᴀᴄᴋᴇᴛ ʜᴏʟᴏɢʀᴀᴍꜱ & ɴᴘᴄꜱ", effect: "WAVE", effect-speed: 2, color-a: "#6293F0", color-b: "#FFFFFF", scale: 1.1, offset-y: 0.1, background-default: false}
      - {type: "TEXT", text: "&7Typing out text one letter at a time...", effect: "TYPEWRITER", effect-speed: 2}
      - {type: "TEXT", text: "&#FFD700Scrolling marquee with {online} players online   ", effect: "SCROLL", effect-speed: 2, scroll-width: 28}
      - {type: "TEXT", text: "&aᴏɴʟɪɴᴇ &f{online}||&eᴍᴀx &f{max}||&bᴛɪᴍᴇ &f{time}", frame-interval: 30}
      - {type: "TEXT", text: "&#FF0000&l● ʟɪᴠᴇ", effect: "BLINK", effect-speed: 10}
      - {type: "TEXT", text: "&7{online}&8/&7{max} &8• &7{time}"}
