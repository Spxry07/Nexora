      glow: true
      glow-color: "dark_purple"
      look-at: true
      look-range: 16
      swing-interval: 25
      particle: "ENCHANT"
      particle-count: 8
      particle-radius: 0.8
      particle-interval: 4
      actions: "[sound] block.enchantment_table.use\n[message] &#B455F0&lᴡɪᴢᴀʀᴅ &7» &fBehold my levitating blocks, &#B455F0{player}&f!"
