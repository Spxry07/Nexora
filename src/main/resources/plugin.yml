name: Nexora
version: '${project.version}'
main: net.spxry.nexora.Nexora
description: Packet-based animated holograms and NPCs with in-game and web editors
api-version: '1.21'
author: Spxry Studios
folia-supported: true
commands:
  nexora:
    usage: /<command> [gui|dialog|holo|npc|web|demo|mineskin|reload|help]
    description: Nexora holograms and NPCs
    aliases:
      - nx
permissions:
  nexora.admin:
    default: op
    description: Create and edit holograms and NPCs
  nexora.web:
    default: op
    description: Open the web editor
