prefix: "&#6293F0&lNEXORA &7» "

startup:
  nms-failed: "Nexora needs Paper 1.21.11 (Mojang-mapped NMS). Disabling."

cmd:
  player-only:
    messages:
      - "{prefix}&#FF0000Only players can use this command."
  no-permission:
    messages:
      - "{prefix}&#FF0000You do not have permission to do that."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  help:
    messages:
      - "{prefix}&#6293F0Commands"
      - "&8» &f/nexora &7- open the main menu"
      - "&8» &f/nexora reload &7- reload all configuration"
      - "&8» &f/nexora web &7- get the web editor link"
      - "&8» &f/nexora web port <port|random> &7- change the web editor port"
      - "&8» &f/nexora web info &7- show the web editor address"
      - "&8» &f/nexora <holo|npc> create <id> &7- create at your position"
      - "&8» &f/nexora <holo|npc> edit [id] &7- open the editor"
      - "&8» &f/nexora <holo|npc> delete <id> &7- delete"
      - "&8» &f/nexora <holo|npc> movehere <id> &7- move to you"
      - "&8» &f/nexora <holo|npc> tp <id> &7- teleport to it"
      - "&8» &f/nexora <holo|npc> list &7- list ids"
      - "&8» &f/nexora <holo|npc> path <id> <add|clear> &7- edit path"
      - "&8» &f/nexora holo addline <id> <text> &7- add a text line (\\n = new line)"
      - "&8» &f/nexora holo additem <id> &7- add your held item as a line"
      - "&8» &f/nexora npc equip <id> <slot> &7- equip your held item (empty hand clears)"
      - "&8» &f/nexora npc skin <id> <player|name> &7- set the skin"
      - "&8» &f/nexora demo &7- spawn demo NPCs and holograms in front of you"
      - "&8» &f/nexora demo clear &7- remove the demo objects"
      - "&8» &f/nexora mineskin <key> &7- enable Skinned Model NPCs (posable skinned limbs)"
  reloaded:
    messages:
      - "{prefix}&#00FF5AConfiguration reloaded."
    sound: "entity.player.levelup"
    sound-volume: 1.0
    sound-pitch: 1.0
  web-disabled:
    messages:
      - "{prefix}&#FF0000The web editor is disabled."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  invalid-id:
    messages:
      - "{prefix}&#FF0000Invalid id '{id}'. Use 1-32 letters, numbers, - or _."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  exists:
    messages:
      - "{prefix}&#FF0000A {kind} with the id '{id}' already exists."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  not-found:
    messages:
      - "{prefix}&#FF0000'{id}' does not exist."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  created:
    messages:
      - "{prefix}&7Created {kind} &#6293F0{id}&7."
    sound: "entity.player.levelup"
    sound-volume: 1.0
    sound-pitch: 1.0
  deleted:
    messages:
      - "{prefix}&7Deleted &#6293F0{id}&7."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  moved:
    messages:
      - "{prefix}&7Moved &#6293F0{id}&7 to your position."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  teleported:
    messages:
      - "{prefix}&7Teleported to &#6293F0{id}&7."
    sound: "entity.enderman.teleport"
    sound-volume: 1.0
    sound-pitch: 1.0
  list:
    messages:
      - "{prefix}&#6293F0{kind}&7: &f{ids}"
  list-empty:
    messages:
      - "{prefix}&7No {kind} yet."
  line-added:
    messages:
      - "{prefix}&7Added a line to &#6293F0{id}&7."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  line-max:
    messages:
      - "{prefix}&#FF0000A hologram can have at most {max} lines."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  no-item:
    messages:
      - "{prefix}&#FF0000Hold an item in your main hand."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  path-added:
    messages:
      - "{prefix}&7Added a path point to &#6293F0{id}&7."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  path-cleared:
    messages:
      - "{prefix}&7Cleared the path of &#6293F0{id}&7."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  path-max:
    messages:
      - "{prefix}&#FF0000The path of '{id}' has reached the maximum number of points."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  equip-set:
    messages:
      - "{prefix}&7Equipped &#6293F0{slot}&7 on &#6293F0{id}&7."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  equip-cleared:
    messages:
      - "{prefix}&7Cleared &#6293F0{slot}&7 on &#6293F0{id}&7."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  invalid-slot:
    messages:
      - "{prefix}&#FF0000Unknown equipment slot '{slot}'."
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  demo-spawned:
    messages:
      - "{prefix}&7Spawned &#6293F0{count}&7 demo objects: &f{ids}"
      - "{prefix}&7Right-click the NPC, then edit anything with &#6293F0/nexora&7. Remove with &#6293F0/nexora demo clear&7."
    sound: "entity.player.levelup"
    sound-volume: 1.0
    sound-pitch: 1.2
  mineskin-usage:
    messages:
      - "{prefix}&#FF0000Usage: /nexora mineskin <api-key> (get one free at account.mineskin.org)"
    sound: "entity.villager.no"
    sound-volume: 0.8
    sound-pitch: 1.0
  mineskin-set:
    messages:
      - "{prefix}&#00FF5AMineSkin key saved. Skinned Model NPCs will now generate their limbs."
    sound: "entity.player.levelup"
    sound-volume: 1.0
    sound-pitch: 1.0
  demo-cleared:
    messages:
      - "{prefix}&7Removed &#6293F0{count}&7 demo objects."
    sound: "entity.experience_orb.pickup"
    sound-volume: 1.0
    sound-pitch: 1.0
  skin-set:
    messages:
      - "{prefix}&7Skin of &#6293F0{id}&7 set from &#6293F0{skin}&7."
    sound: "entity.player.levelup"
    sound-volume: 1.0
    sound-pitch: 1.0

