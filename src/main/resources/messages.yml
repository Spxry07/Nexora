    object: "&f{id}"
    lines: "&#6293F0ʟɪɴᴇꜱ"
    equipment: "&#6293F0ᴇQᴜɪᴘᴍᴇɴᴛ"
    move-here: "&fᴍᴏᴠᴇ ʜᴇʀᴇ"
    teleport: "&fᴛᴇʟᴇᴘᴏʀᴛ"
