web-link: "{prefix}&7Web editor ready &8(expires in {minutes} min)&7: &#6293F0&nᴄʟɪᴄᴋ ᴛᴏ ᴏᴘᴇɴ"
web-link-hover: "&#6293F0ᴏᴘᴇɴ ᴛʜᴇ ɴᴇxᴏʀᴀ ᴡᴇʙ ᴇᴅɪᴛᴏʀ"

web-no-permission:
  overall-enabled: true
  messages-enabled: true
  messages:
    - "{prefix}&#FF0000You do not have permission to use the web editor."
  actionbar-enabled: false
  Actionbar: ""
  sound-enabled: true
  sound: "entity.villager.no"
  sound-volume: 1.0
  sound-pitch: 1.0

web-disabled:
  overall-enabled: true
  messages-enabled: true
  messages:
    - "{prefix}&#FF0000The web editor is disabled or failed to start."
  actionbar-enabled: false
  Actionbar: ""
  sound-enabled: true
  sound: "entity.villager.no"
  sound-volume: 1.0
  sound-pitch: 1.0

web-port-changed:
  overall-enabled: true
  messages-enabled: true
  messages:
    - "{prefix}&7Web editor restarted on port &#6293F0{port}&7. Run &f/nexora web &7for a fresh link."
  actionbar-enabled: false
  Actionbar: ""
  sound-enabled: true
  sound: "entity.player.levelup"
  sound-volume: 1.0
  sound-pitch: 1.0

web-port-invalid:
  overall-enabled: true
  messages-enabled: true
  messages:
    - "{prefix}&#FF0000Use /nexora web port <{min}-{max}|random>."
  actionbar-enabled: false
  Actionbar: ""
  sound-enabled: true
  sound: "entity.villager.no"
  sound-volume: 1.0
  sound-pitch: 1.0

web-port-failed:
  overall-enabled: true
  messages-enabled: true
  messages:
    - "{prefix}&#FF0000The web editor could not start on that port. Check the console."
  actionbar-enabled: false
  Actionbar: ""
  sound-enabled: true
  sound: "entity.villager.no"
  sound-volume: 1.0
  sound-pitch: 1.0

web-info:
  overall-enabled: true
  messages-enabled: true
  messages:
    - "{prefix}&7Web editor address: &#6293F0{host}:{port}"
  actionbar-enabled: false
  Actionbar: ""
  sound-enabled: true
  sound: "entity.experience_orb.pickup"
  sound-volume: 1.0
  sound-pitch: 1.0

web-bind-failed: "Web editor could not bind to {bind}:{port}."
web-port-exhausted: "Web editor found no free port in {min}-{max} after {attempts} attempts."
web-port-save-failed: "Web editor could not save its port to {file}."
web-page-missing: "Web editor page resource is missing from the jar."
web-error-unauthorized: "Session expired or invalid. Run the web command in game again."
web-error-not-found: "Not found."
web-error-method: "Method not allowed."
web-error-too-large: "Request body is too large."
web-error-bad-request: "Invalid request."
web-error-invalid-kind: "Unknown object kind '{kind}'."
web-error-invalid-id: "Invalid id '{id}'."
web-error-unknown-object: "No {kind} named '{id}' exists."
web-error-id-exists: "A {kind} named '{id}' already exists."
web-error-offline: "You must be online in game to do this."
web-error-timeout: "The server took too long to respond."
web-error-gone: "That object no longer exists."
web-error-internal: "Internal server error."
web-error-waypoint-limit: "Waypoint limit of {limit} reached."
web-error-teleport: "Teleport failed."
web-error-world-missing: "The object's world is not loaded."
web-error-bad-action: "Unknown action '{action}'."
web-error-bad-material: "'{material}' is not an item."
web-error-unknown-world: "World '{world}' is not loaded."
web-error-world-mismatch: "Objects can only be moved within their own world ({world})."
web-error-move-too-far: "That is more than {max} blocks from the current position."
