title: "&#6293F0&lᴛʀɪɢɢᴇʀꜱ &8» &7{id}"
size: 54
slots:
  - "10-16"
  - "19-25"

preview-rules: 5
preview-length: 40

prompt:
  title: "&#6293F0&lʀᴀᴡ ᴛʀɪɢɢᴇʀꜱ &8» &7{id}"
  body: "&7One rule per line: &fevent -> action; action"
  label: "&fʀᴜʟᴇꜱ"

starter:
  lore:
    - "&8Description:"
    - ""
    - "&f{description}"
    - ""
    - "&fRule:"
    - "&7{rule}"
    - ""
    - "&#6293F0&l➥ &nCLICK&#6293F0 to add this rule"

rules:
  click-burst:
    kinds: ["npc", "hologram"]
    material: "FIREWORK_STAR"
    name: "&#6293F0ᴄʟɪᴄᴋ ʙᴜʀꜱᴛ"
    description: "Burst of totem particles when clicked."
    rule: "click -> particle! TOTEM_OF_UNDYING 20 body 0.6"
  click-title:
    kinds: ["npc", "hologram"]
    material: "NAME_TAG"
    name: "&#6293F0ᴄʟɪᴄᴋ ᴛɪᴛʟᴇ"
    description: "Show a title to the clicking player."
    rule: "click -> title &#6293F0Hello|&7{player}"
  click-signal:
    kinds: ["npc", "hologram"]
    material: "REDSTONE_TORCH"
    name: "&#6293F0ᴄʟɪᴄᴋ ꜱɪɢɴᴀʟ"
    description: "Emit a signal other objects can react to."
    rule: "click -> signal clicked"
  signal-react:
    kinds: ["npc", "hologram"]
    material: "REPEATER"
    name: "&#6293F0ʀᴇᴀᴄᴛ ᴛᴏ ꜱɪɢɴᴀʟ"
    description: "Sparkle and chime after a delay when the clicked signal arrives."
    rule: "signal clicked -> particle! HAPPY_VILLAGER 12 above 0.5; delay 20; sound! entity.player.levelup"
  approach-greet:
    kinds: ["npc", "hologram"]
    material: "OAK_DOOR"
    name: "&#6293F0ᴀᴘᴘʀᴏᴀᴄʜ ɢʀᴇᴇᴛ"
    description: "Greet players who walk close."
    rule: "approach -> message &fWelcome &#6293F0{player}&f!; sound entity.experience_orb.pickup"
  leave-bye:
    kinds: ["npc", "hologram"]
    material: "IRON_DOOR"
    name: "&#6293F0ʟᴇᴀᴠᴇ ᴍᴇꜱꜱᴀɢᴇ"
    description: "Say goodbye when players walk away."
    rule: "leave -> actionbar &7Come back soon!"
  interval-sparkle:
    kinds: ["npc", "hologram"]
    material: "GLOWSTONE_DUST"
    name: "&#6293F0ᴘᴇʀɪᴏᴅɪᴄ ꜱᴘᴀʀᴋʟᴇ"
    description: "Emit end rod particles every two seconds."
    rule: "interval 40 -> particle END_ROD 6 above 0.4"
  look-heart:
    kinds: ["npc"]
    material: "ENDER_EYE"
    name: "&#6293F0ʟᴏᴏᴋ ʜᴇᴀʀᴛꜱ"
    description: "Hearts and a villager sound when looked at."
    rule: "look -> particle HEART 3 head; sound entity.villager.ambient"
  click-wave:
    kinds: ["npc"]
    material: "FEATHER"
    name: "&#6293F0ᴄʟɪᴄᴋ ᴡᴀᴠᴇ"
    description: "Swing the arm when clicked."
    rule: "click -> swing main; look"
  click-spin:
    kinds: ["hologram"]
    material: "COMPASS"
    name: "&#6293F0ᴄʟɪᴄᴋ ꜱᴘɪɴ"
    description: "Spin the hologram when clicked."
    rule: "click -> spin 720 40; sound entity.experience_orb.pickup"
  click-pulse:
    kinds: ["hologram"]
    material: "SLIME_BALL"
    name: "&#6293F0ᴄʟɪᴄᴋ ᴘᴜʟꜱᴇ"
    description: "Pulse the hologram when clicked."
    rule: "click -> pulse 0.3 20"
  approach-glow:
    kinds: ["hologram"]
    material: "GLOWSTONE"
    name: "&#6293F0ᴀᴘᴘʀᴏᴀᴄʜ ɢʟᴏᴡ"
    description: "Glow while a player is near."
    rule: "approach -> glow on\nleave -> glow off"
  look-grow:
    kinds: ["hologram"]
    material: "AMETHYST_SHARD"
    name: "&#6293F0ʟᴏᴏᴋ ɢʀᴏᴡ"
    description: "Grow briefly when looked at."
    rule: "look -> scale 1.3 10"
  click-beam:
    kinds: ["hologram"]
    material: "END_ROD"
    name: "&#6293F0ᴄʟɪᴄᴋ ʙᴇᴀᴍ"
    description: "Draw a particle beam to the clicking player."
    rule: "click -> particle END_ROD 12 center to player"

items:
  back:
    slot: 45
  current:
    slot: 4
    material: "KNOWLEDGE_BOOK"
    name: "&#6293F0ᴄᴜʀʀᴇɴᴛ ʀᴜʟᴇꜱ"
    lore:
      - "&8Description:"
      - ""
      - "&fRules: &#6293F0{count}"
      - "&7{rules}"
      - ""
      - "&8Pick a starter rule below to append it."
  raw:
    slot: 48
    material: "WRITABLE_BOOK"
    name: "&#6293F0ᴇᴅɪᴛ ʀᴀᴡ ʀᴜʟᴇꜱ"
    lore:
      - "&8Description:"
      - ""
      - "&fEdit the full trigger text in a dialog."
      - ""
      - "&#6293F0&l➥ &nCLICK&#6293F0 to edit the raw rules"
  clear:
    slot: 49
    material: "LAVA_BUCKET"
    name: "&#FF0000ᴄʟᴇᴀʀ ᴀʟʟ"
    lore:
      - "&8Description:"
      - ""
      - "&fRemove every trigger rule."
      - ""
      - "&#FF0000&l➥ &nCLICK&#FF0000 to clear all rules"
  web:
    slot: 50
    material: "COMPASS"
    name: "&#6293F0ᴏᴘᴇɴ ᴡᴇʙ ᴇᴅɪᴛᴏʀ"
    lore:
      - "&8Description:"
      - ""
      - "&fBuild triggers visually in the web editor."
      - ""
      - "&#6293F0&l➥ &nCLICK&#6293F0 to get the web link"
