    material: "ARROW"
    name: "&7ʙᴀᴄᴋ"
    lore:
      - "&8Description:"
      - ""
      - "&fReturn to the previous menu."
      - ""
      - "&#6293F0&l➥ &nCLICK&#6293F0 to go back"
  prev:
    slot: 46
    material: "ARROW"
    name: "&#6293F0ᴘʀᴇᴠɪᴏᴜꜱ ᴘᴀɢᴇ"
    lore:
      - "&8Description:"
      - ""
      - "&fPage &#6293F0{page}&f of &#6293F0{pages}&f."
      - ""
      - "&#6293F0&l➥ &nCLICK&#6293F0 to go to the previous page"
  next:
    slot: 52
    material: "ARROW"
    name: "&#6293F0ɴᴇxᴛ ᴘᴀɢᴇ"
    lore:
      - "&8Description:"
      - ""
      - "&fPage &#6293F0{page}&f of &#6293F0{pages}&f."
      - ""
      - "&#6293F0&l➥ &nCLICK&#6293F0 to go to the next page"
  close:
