debug: false

permissions:
  admin: "nexora.admin"
  web: "nexora.web"

ids:
  pattern: "[a-zA-Z0-9_-]{1,32}"

animation:
  interval-ticks: 2
  frame-separator: "||"

tracker:
  interval-ticks: 3
  reset-distance: 32

display:
  view-range-unit: 64
  fallback-material: "STONE"

effects:
  typewriter-hold-steps: 20
  rainbow-step: 0.02
  rainbow-spread: 0.06
  rainbow-saturation: 0.85
  rainbow-brightness: 1.0
  wave-step: 0.25
  wave-spread: 0.35
  scroll-gap: "     "
  flicker-chance: 0.35
  fade-step: 0.08

placeholders:
  time-format: "HH:mm:ss"
  date-format: "dd/MM/yyyy"

actions:
  console: "[console]"
  player: "[player]"
  message: "[message]"
  actionbar: "[actionbar]"
  sound: "[sound]"

limits:
  max-lines: 32
  max-waypoints: 64

npc:
  default-type: "MANNEQUIN"
  triggers:
    look-angle: 10
    default-cooldown: 40
    max-rules: 64
    max-actions: 16
    max-particles: 200
    look-hold-ticks: 40
    title:
      fade-in: 500
      stay: 3500
      fade-out: 1000
  nameplate:
    id-suffix: "-tag"
    base-height: 1.8
    line-spacing: 0.28
  animations:
    WAVE: "8 swing=main head=0,0,10\n8 swing=main head=0,0,-10\n8 swing=main head=0,0,10\n30 head=0,0,0"
    NOD: "6 head=20,0,0\n6 head=-5,0,0\n6 head=20,0,0\n40 head=0,0,0"
    LOOK_AROUND: "30 head=0,45,0\n30 head=10,-45,0\n30 head=0,0,0"
    CHEER: "6 swing=main head=-15,0,0\n6 swing=off\n6 swing=main\n6 swing=off\n6 pose=SNEAKING head=0,0,0\n10 pose=STANDING"
    CROUCH_DANCE: "5 pose=SNEAKING head=0,20,0\n5 pose=STANDING swing=main\n5 pose=SNEAKING head=0,-20,0\n5 pose=STANDING swing=off"
    ARCHER: "20 item=bow use=none head=0,0,0\n25 use=main head=-5,0,0\n6 use=none swing=main\n20 head=0,0,0"
    CROSSBOW: "20 item=crossbow use=none\n25 use=main\n8 use=none swing=main\n20 head=0,0,0"
    TRIDENT: "20 item=trident use=none head=0,0,0\n20 use=main head=-20,0,0\n6 use=none swing=main\n20 head=0,0,0"
    CAST: "20 item=blaze_rod use=none head=0,0,0\n18 item=trident use=main head=-25,0,0\n6 use=none swing=main item=blaze_rod\n16 head=10,0,0\n10 head=0,0,0"
    SPYGLASS: "15 item=spyglass use=none head=0,0,0\n40 use=main head=-10,30,0\n40 head=-10,-30,0\n15 use=none head=0,0,0"
    HORN: "20 item=goat_horn use=none head=0,0,0\n30 use=main head=-25,0,0\n30 use=none head=0,0,0"
    SHIELD: "20 offitem=shield use=none\n40 use=off\n20 use=none swing=main"
    GUARD: "40 item=iron_sword offitem=shield use=off head=0,25,0\n40 head=0,-25,0\n10 use=none swing=main head=0,0,0"
    FEAST: "10 item=cooked_beef use=none head=0,0,0\n32 use=main\n20 use=none head=0,20,0\n10 head=0,0,0"
    POTION: "10 item=potion use=none head=0,0,0\n32 use=main head=-20,0,0\n20 use=none head=0,0,0"
    SWIMMER: "60 pose=SWIMMING swing=main\n60 swing=off"
    RIPTIDE: "40 pose=SPIN_ATTACK item=trident\n30 pose=STANDING"
    SLEEPY: "100 pose=SLEEPING"
  equipment-slots:
    - HAND
    - OFF_HAND
    - HEAD
    - CHEST
    - LEGS
    - FEET

dialogs:
  columns: 2
  button-width: 150
  input-width: 300
  multiline-max-lines: 8
  multiline-height: 96
  callback-lifetime-minutes: 30
  preview-length: 24

web:
  enabled: true
  bind: "0.0.0.0"
  port: 0
  random-port-min: 20000
  random-port-max: 40000
  random-port-attempts: 20
  host: ""
  ip-lookup-url: "https://api.ipify.org"
  ip-lookup-timeout-seconds: 5
  public-url: ""
  session-minutes: 60
  max-body-bytes: 262144
  request-timeout-seconds: 10
  terrain-max-radius: 48
  max-move-distance: 64
  assets:
    texture: "https://assets.mcasset.cloud/1.21.11/assets/minecraft/textures/{type}/{name}.png"
    skin: "https://mc-heads.net/skin/{id}"
    head: "https://mc-heads.net/avatar/{id}/{size}"
    body: "https://mc-heads.net/body/{id}/{size}"
    viewer: "https://cdn.jsdelivr.net/npm/skinview3d@3.1.0/bundles/skinview3d.bundle.js"
    font: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap"
    font-files-host: "https://fonts.gstatic.com"

storage:
  shutdown-timeout-seconds: 10

defaults:
  hologram:
    view-range: 48
    line-spacing: 0.3
    attach-to: ""
    attach-height: 0.3
    layout: "STACK"
    layout-radius: 1.5
    layout-speed: 30
    helix-step: 30
    wave-height: 0
    wave-speed: 0.5
    spin-speed: 0
    bob-height: 0
    bob-speed: 0.5
    orbit-radius: 0
    orbit-speed: 0.25
    pulse-amount: 0
    pulse-speed: 0.5
    sway-angle: 0
    sway-speed: 0.5
    path-speed: 0
    particle: "NONE"
    particle-count: 3
    particle-radius: 0.5
    particle-interval: 10
  line:
    type: "TEXT"
    text: "&#6293F0&lɴᴇxᴏʀᴀ\n&7Edit me with &f/nexora"
    material: "DIAMOND"
    frame-interval: 40
    effect: "NONE"
    effect-speed: 2
    color-a: "#6293F0"
    color-b: "#FFFFFF"
    scroll-width: 16
    scale: 1
    offset-y: 0
    offset-x: 0
    offset-z: 0
    rot-x: 0
    rot-y: 0
    rot-z: 0
    billboard: "CENTER"
    background-default: true
    background: "#40000000"
    shadow: true
    see-through: false
    alignment: "CENTER"
    line-width: 200
    opacity: 255
    glow: false
    glow-color: "#6293F0"
    brightness: -1
    item-transform: "FIXED"
  npc:
    entity-type: "MANNEQUIN"
    name: "&#6293F0&lɴᴇxᴏʀᴀ ɴᴘᴄ"
    name-visible: true
    description: "&7Right-click me"
    skin-name: ""
    skin-value: ""
    skin-signature: ""
    pose: "STANDING"
    glow: false
    glow-color: "blue"
    scale: 1
    look-at: true
    look-range: 8
    actions: "[message] &fHello &#6293F0{player}&f!"
    click-type: "ANY"
    cooldown: 20
    animation-speed: 1
    animation: "NONE"
    triggers: "look -> particle HEART 3 head; sound entity.villager.ambient\nclick -> particle! TOTEM_OF_UNDYING 20 body 0.6"
    look-trigger-range: 6
    approach-range: 5
    nameplate: false
    nameplate-height: 0.35
    swing-interval: 0
    sneak-interval: 0
    hurt-interval: 0
    spin-speed: 0
    view-range: 48
    path-speed: 0
    particle: "NONE"
    particle-count: 3
    particle-radius: 0.5
    particle-interval: 10

