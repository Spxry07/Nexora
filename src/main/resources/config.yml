debug: false

permissions:
  admin: "nexora.admin"
  web: "nexora.web"

ids:
  pattern: "[a-zA-Z0-9_-]{1,32}"

animation:
  interval-ticks: 2
  frame-separator: "||"

tracker:
  interval-ticks: 3
  reset-distance: 32

display:
  view-range-unit: 64
  fallback-material: "STONE"

effects:
  typewriter-hold-steps: 20
  rainbow-step: 0.02
  rainbow-spread: 0.06
  rainbow-saturation: 0.85
  rainbow-brightness: 1.0
  wave-step: 0.25
  wave-spread: 0.35
  scroll-gap: "     "
  flicker-chance: 0.35
  fade-step: 0.08

placeholders:
  time-format: "HH:mm:ss"
  date-format: "dd/MM/yyyy"

actions:
  console: "[console]"
  player: "[player]"
  message: "[message]"
  actionbar: "[actionbar]"
  sound: "[sound]"

limits:
  max-lines: 32
  max-waypoints: 64

npc:
  default-type: "MANNEQUIN"
  triggers:
    look-angle: 10
    default-cooldown: 40
    max-rules: 64
    max-actions: 16
    max-particles: 200
    look-hold-ticks: 40
    title:
      fade-in: 500
      stay: 3500
      fade-out: 1000
  nameplate:
    id-suffix: "-tag"
    base-height: 1.8
    line-spacing: 0.28
  animations:
    WAVE: "8 swing=main rarm=165,0,-25 head=0,0,10\n8 swing=main rarm=165,0,15 head=0,0,-10\n8 swing=main rarm=165,0,-25 head=0,0,10\n30 rarm=0,0,0 head=0,0,0"
    NOD: "6 head=20,0,0\n6 head=-5,0,0\n6 head=20,0,0\n40 head=0,0,0"
    LOOK_AROUND: "30 head=0,45,0\n30 head=10,-45,0\n30 head=0,0,0"
    CHEER: "6 swing=main rarm=170,0,-15 larm=170,0,15 head=-15,0,0\n6 swing=off rarm=140,0,-30 larm=140,0,30\n6 swing=main rarm=170,0,-15 larm=170,0,15\n6 swing=off pose=SNEAKING rarm=0,0,0 larm=0,0,0 head=0,0,0\n10 pose=STANDING"
    CROUCH_DANCE: "5 pose=SNEAKING head=0,20,0 rarm=40,0,-20 larm=-20,0,20 lleg=-15,0,0 rleg=15,0,0\n5 pose=STANDING swing=main rarm=-20,0,-20 larm=40,0,20 lleg=15,0,0 rleg=-15,0,0\n5 pose=SNEAKING head=0,-20,0 rarm=40,0,-20 larm=-20,0,20 lleg=-15,0,0 rleg=15,0,0\n5 pose=STANDING swing=off rarm=-20,0,-20 larm=40,0,20 lleg=15,0,0 rleg=-15,0,0"
    ARCHER: "20 item=bow use=none head=0,0,0 rarm=0,0,0 larm=0,0,0\n25 use=main head=-5,0,0 rarm=90,-15,0 larm=90,35,0\n6 use=none swing=main rarm=60,0,0 larm=60,0,0\n20 head=0,0,0 rarm=0,0,0 larm=0,0,0"
    CROSSBOW: "20 item=crossbow use=none rarm=0,0,0 larm=0,0,0\n25 use=main rarm=80,-20,0 larm=60,30,0\n8 use=none swing=main rarm=90,0,0 larm=90,30,0\n20 head=0,0,0 rarm=0,0,0 larm=0,0,0"
    TRIDENT: "20 item=trident use=none head=0,0,0 rarm=0,0,0\n20 use=main head=-20,0,0 rarm=170,0,-10\n6 use=none swing=main rarm=60,0,0\n20 head=0,0,0 rarm=0,0,0"
    CAST: "20 item=blaze_rod use=none head=0,0,0 rarm=0,0,0 larm=0,0,0\n18 item=trident use=main head=-25,0,0 rarm=160,0,-20 larm=120,0,30\n6 use=none swing=main item=blaze_rod rarm=90,0,0 larm=60,0,20\n16 head=10,0,0 rarm=40,0,0 larm=20,0,0\n10 head=0,0,0 rarm=0,0,0 larm=0,0,0"
    SPYGLASS: "15 item=spyglass use=none head=0,0,0 rarm=0,0,0\n40 use=main head=-10,30,0 rarm=130,30,0\n40 head=-10,-30,0 rarm=130,-20,0\n15 use=none head=0,0,0 rarm=0,0,0"
    HORN: "20 item=goat_horn use=none head=0,0,0 rarm=0,0,0\n30 use=main head=-25,0,0 rarm=140,20,0\n30 use=none head=0,0,0 rarm=0,0,0"
    SHIELD: "20 offitem=shield use=none larm=0,0,0\n40 use=off larm=60,40,0\n20 use=none swing=main larm=0,0,0 rarm=70,0,0\n10 rarm=0,0,0"
    GUARD: "40 item=iron_sword offitem=shield use=off head=0,25,0 larm=50,40,0 rarm=30,0,0\n40 head=0,-25,0\n10 use=none swing=main head=0,0,0 rarm=100,0,0\n10 rarm=30,0,0"
    FEAST: "10 item=cooked_beef use=none head=0,0,0 rarm=0,0,0\n32 use=main rarm=110,30,0 head=10,0,0\n20 use=none head=0,20,0 rarm=0,0,0\n10 head=0,0,0"
    POTION: "10 item=potion use=none head=0,0,0 rarm=0,0,0\n32 use=main head=-20,0,0 rarm=130,20,0\n20 use=none head=0,0,0 rarm=0,0,0"
    SWIMMER: "60 pose=SWIMMING swing=main rarm=170,0,0 larm=170,0,0\n60 swing=off rarm=90,0,-60 larm=90,0,60"
    RIPTIDE: "40 pose=SPIN_ATTACK item=trident rarm=170,0,0\n30 pose=STANDING rarm=0,0,0"
    SLEEPY: "100 pose=SLEEPING head=15,0,0"
    WALK: "10 rarm=-30,0,0 larm=30,0,0 rleg=30,0,0 lleg=-30,0,0\n10 rarm=30,0,0 larm=-30,0,0 rleg=-30,0,0 lleg=30,0,0"
    SALUTE: "10 rarm=150,-40,0 head=-5,0,0\n40 rarm=150,-40,0\n10 rarm=0,0,0 head=0,0,0\n20"
    POINT: "10 rarm=90,0,0 head=0,0,0\n40 rarm=90,0,0\n10 rarm=0,0,0\n20"
    BOW: "12 body=30,0,0 head=20,0,0 rarm=-20,0,0 larm=-20,0,0\n20 body=30,0,0\n12 body=0,0,0 head=0,0,0 rarm=0,0,0 larm=0,0,0\n30"
    DAB: "8 rarm=120,0,-60 larm=100,60,40 head=35,-30,0\n30 rarm=120,0,-60\n8 rarm=0,0,0 larm=0,0,0 head=0,0,0\n20"
    ZOMBIE: "20 rarm=90,0,0 larm=90,0,0 head=0,0,0\n20 rarm=95,0,5 larm=85,0,-5 head=5,10,0"
    DANCE: "6 rarm=150,0,-30 larm=20,0,20 rleg=20,0,0 lleg=-10,0,0 body=0,15,0 head=0,15,0\n6 rarm=20,0,-20 larm=150,0,30 rleg=-10,0,0 lleg=20,0,0 body=0,-15,0 head=0,-15,0"
  equipment-slots:
    - HAND
    - OFF_HAND
    - HEAD
    - CHEST
    - LEGS
    - FEET

triggers:
  max-signal-depth: 4
  max-delay-ticks: 6000

reactive:
  ease-rate: 5
  face-turn-speed: 360
  morph-ticks: 40
  pulse-amount: 0.25
  pulse-ticks: 10

admin:
  sneak-click-edit: true
  default-menu: "GUI"

dialogs:
  columns: 2
  button-width: 150
  input-width: 300
  multiline-max-lines: 8
  multiline-height: 96
  callback-lifetime-minutes: 30
  preview-length: 24

web:
  enabled: true
  bind: "0.0.0.0"
  port: 0
  random-port-min: 20000
  random-port-max: 40000
  random-port-attempts: 20
  host: ""
  ip-lookup-url: "https://api.ipify.org"
  ip-lookup-timeout-seconds: 5
  public-url: ""
  session-minutes: 60
  max-body-bytes: 262144
  request-timeout-seconds: 10
  terrain-max-radius: 48
  max-move-distance: 64
  assets:
    texture: "https://assets.mcasset.cloud/1.21.11/assets/minecraft/textures/{type}/{name}.png"
    skin: "https://mc-heads.net/skin/{id}"
    head: "https://mc-heads.net/avatar/{id}/{size}"
    body: "https://mc-heads.net/body/{id}/{size}"
    viewer: "https://cdn.jsdelivr.net/npm/skinview3d@3.1.0/bundles/skinview3d.bundle.js"
    font: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap"
    font-files-host: "https://fonts.gstatic.com"

storage:
  shutdown-timeout-seconds: 10

