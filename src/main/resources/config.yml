model:
  mineskin:
    api-key: ""
    user-agent: "Nexora/1.0"
    queue-url: "https://api.mineskin.org/v2/queue"
    me-url: "https://api.mineskin.org/v2/me"
    poll-ms: 1500
    timeout-seconds: 20
    max-concurrent-skins: 2
    visibility: "unlisted"
  skin-url:
    hash: "http://textures.minecraft.net/texture/{hash}"
    name: "https://mc-heads.net/skin/{name}"
  item-transform: "NONE"
  cube-size: 0.5
  cube-offset-y: -0.25
  part-yaw: 0
  hitbox-width: 0.6
  eye-height: 1.62
  look-max-yaw: 70
  look-max-pitch: 40
  walk-swing: 30
  walk-phase-per-block: 2.66
  walk-blend: 0.35
  hitbox-height: 1.8
  hand-transform-main: "THIRDPERSON_RIGHTHAND"
  hand-transform-off: "THIRDPERSON_LEFTHAND"
  hand-adjust-x: 0
  hand-adjust-y: 0
  hand-adjust-z: 0
  look-smoothing: 0.4
  swing-angle: 80
  swing-ticks: 6
