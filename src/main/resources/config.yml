  hologram:
    view-range: 48
    line-spacing: 0.3
    attach-to: ""
    attach-height: 0.3
    layout: "STACK"
    layout-radius: 1.5
    layout-speed: 30
    helix-step: 30
    wave-height: 0
    wave-speed: 0.5
