debug: false

permissions:
  admin: "nexora.admin"
  web: "nexora.web"

ids:
  pattern: "[a-zA-Z0-9_-]{1,32}"

animation:
  interval-ticks: 2
  frame-separator: "||"

tracker:
  interval-ticks: 3
  reset-distance: 32

display:
  view-range-unit: 64
  fallback-material: "STONE"

effects:
  typewriter-hold-steps: 20
  rainbow-step: 0.02
  rainbow-spread: 0.06
  rainbow-saturation: 0.85
  rainbow-brightness: 1.0
  wave-step: 0.25
  wave-spread: 0.35
  scroll-gap: "     "

placeholders:
  time-format: "HH:mm:ss"
  date-format: "dd/MM/yyyy"

actions:
  console: "[console]"
  player: "[player]"
  message: "[message]"
  actionbar: "[actionbar]"
  sound: "[sound]"

limits:
  max-lines: 32
  max-waypoints: 64

npc:
  default-type: "MANNEQUIN"
  equipment-slots:
    - HAND
    - OFF_HAND
    - HEAD
    - CHEST
    - LEGS
    - FEET

dialogs:
  columns: 2
  button-width: 150
  input-width: 300
  multiline-max-lines: 8
  multiline-height: 96
  callback-lifetime-minutes: 30
  preview-length: 24

web:
  enabled: true
  bind: "0.0.0.0"
  port: 8155
  public-url: ""
  session-minutes: 60
  max-body-bytes: 262144
  request-timeout-seconds: 10

storage:
  shutdown-timeout-seconds: 10

defaults:
  hologram:
    view-range: 48
    line-spacing: 0.3
    spin-speed: 0
    bob-height: 0
    bob-speed: 0.5
    orbit-radius: 0
    orbit-speed: 0.25
    pulse-amount: 0
    pulse-speed: 0.5
    sway-angle: 0
    sway-speed: 0.5
    path-speed: 0
    particle: "NONE"
    particle-count: 3
    particle-radius: 0.5
    particle-interval: 10
  line:
    type: "TEXT"
    text: "&#6293F0&lɴᴇxᴏʀᴀ\n&7Edit me with &f/nexora"
    material: "DIAMOND"
    frame-interval: 40
    effect: "NONE"
    effect-speed: 2
    color-a: "#6293F0"
    color-b: "#FFFFFF"
    scroll-width: 16
    scale: 1
    offset-y: 0
    billboard: "CENTER"
    background-default: true
    background: "#40000000"
    shadow: true
    see-through: false
    alignment: "CENTER"
    line-width: 200
    opacity: 255
    glow: false
    glow-color: "#6293F0"
    brightness: -1
    item-transform: "FIXED"
  npc:
    entity-type: "MANNEQUIN"
    name: "&#6293F0&lɴᴇxᴏʀᴀ ɴᴘᴄ"
    name-visible: true
    description: "&7Right-click me"
    skin-name: ""
    skin-value: ""
    skin-signature: ""
    pose: "STANDING"
    glow: false
    glow-color: "blue"
    scale: 1
    look-at: true
    look-range: 8
    actions: "[message] &fHello &#6293F0{player}&f!"
    click-type: "ANY"
    cooldown: 20
    swing-interval: 0
    sneak-interval: 0
    hurt-interval: 0
    spin-speed: 0
    view-range: 48
    path-speed: 0
    particle: "NONE"
    particle-count: 3
    particle-radius: 0.5
    particle-interval: 10

demo:
  id-prefix: "demo-"
  skin-property: "textures"
  objects:
    npc:
      kind: npc
      offset: {forward: 3, right: -2.5, up: 0, yaw: 180}
      copy-skin: true
      props:
        entity-type: "MANNEQUIN"
        name: "&#6293F0&lʏᴏᴜʀ ᴄʟᴏɴᴇ"
        description: "&7Right-click me"
        glow: true
        glow-color: "blue"
        look-at: true
        look-range: 10
        swing-interval: 40
        sneak-interval: 60
        particle: "END_ROD"
        particle-count: 2
        particle-radius: 0.5
        particle-interval: 10
        actions: "[sound] entity.player.levelup\n[message] &#6293F0&lɴᴇxᴏʀᴀ &7» &fNPC clicks work, &#6293F0{player}&f!"
      equipment:
        HAND: "DIAMOND_SWORD"
        HEAD: "GOLDEN_HELMET"
    walker:
      kind: npc
      offset: {forward: 7, right: 0, up: 0, yaw: 180}
      path-radius: 2.5
      props:
        entity-type: "MANNEQUIN"
        name: "&#00FF5A&lᴘᴀᴛʀᴏʟ"
        description: "&7Walking a path"
        look-at: false
        path-speed: 2
        particle: "HAPPY_VILLAGER"
        particle-count: 1
        particle-radius: 0.3
        particle-interval: 6
    hologram:
      kind: hologram
      offset: {forward: 4, right: 0, up: 1.2, yaw: 180}
      props:
        line-spacing: 0.32
        bob-height: 0.1
        bob-speed: 0.35
        particle: "ELECTRIC_SPARK"
        particle-count: 2
        particle-radius: 1.2
        particle-interval: 8
      lines:
        - {type: "TEXT", text: "&lɴᴇxᴏʀᴀ", effect: "RAINBOW", effect-speed: 1, scale: 1.6}
        - {type: "TEXT", text: "animated packet holograms", effect: "WAVE", effect-speed: 1, color-a: "#6293F0", color-b: "#FFFFFF"}
        - {type: "TEXT", text: "&7{online} online &8• &7{time}"}
    item:
      kind: hologram
      offset: {forward: 3, right: 2.5, up: 0.6, yaw: 180}
      props:
        line-spacing: 0.75
        spin-speed: 120
        pulse-amount: 0.12
        pulse-speed: 0.6
        bob-height: 0.15
        bob-speed: 0.4
      lines:
        - {type: "TEXT", text: "&#40CEFC&lꜱᴘɪɴɴɪɴɢ ɪᴛᴇᴍ", effect: "TYPEWRITER", effect-speed: 2}
        - {type: "ITEM", material: "NETHERITE_SWORD", scale: 1.3, billboard: "FIXED", glow: true, glow-color: "#40CEFC"}
