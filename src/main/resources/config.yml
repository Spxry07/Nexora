debug: false

permissions:
  admin: "nexora.admin"
  web: "nexora.web"

ids:
  pattern: "[a-zA-Z0-9_-]{1,32}"

animation:
  interval-ticks: 2
  frame-separator: "||"

tracker:
  interval-ticks: 3
  reset-distance: 32

display:
  view-range-unit: 64
  fallback-material: "STONE"

effects:
  typewriter-hold-steps: 20
  rainbow-step: 0.02
  rainbow-spread: 0.06
  rainbow-saturation: 0.85
  rainbow-brightness: 1.0
  wave-step: 0.25
  wave-spread: 0.35
  scroll-gap: "     "

placeholders:
  time-format: "HH:mm:ss"
  date-format: "dd/MM/yyyy"

actions:
  console: "[console]"
  player: "[player]"
  message: "[message]"
  actionbar: "[actionbar]"
  sound: "[sound]"

limits:
  max-lines: 32
  max-waypoints: 64

npc:
  default-type: "MANNEQUIN"
  equipment-slots:
    - HAND
    - OFF_HAND
    - HEAD
    - CHEST
    - LEGS
    - FEET

dialogs:
  columns: 2
  button-width: 150
  input-width: 300
  multiline-max-lines: 8
  multiline-height: 96
  callback-lifetime-minutes: 30
  preview-length: 24

web:
  enabled: true
  bind: "0.0.0.0"
  port: 0
  random-port-min: 20000
  random-port-max: 40000
  random-port-attempts: 20
  host: ""
  ip-lookup-url: "https://api.ipify.org"
  ip-lookup-timeout-seconds: 5
  public-url: ""
  session-minutes: 60
  max-body-bytes: 262144
  request-timeout-seconds: 10
  terrain-max-radius: 48
  max-move-distance: 64
  assets:
    texture: "https://assets.mcasset.cloud/1.21.11/assets/minecraft/textures/{type}/{name}.png"
    skin: "https://mc-heads.net/skin/{id}"
    head: "https://mc-heads.net/avatar/{id}/{size}"
    body: "https://mc-heads.net/body/{id}/{size}"
    viewer: "https://cdn.jsdelivr.net/npm/skinview3d@3.1.0/bundles/skinview3d.bundle.js"
    font: "https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap"
    font-files-host: "https://fonts.gstatic.com"

storage:
  shutdown-timeout-seconds: 10

defaults:
  hologram:
    view-range: 48
    line-spacing: 0.3
    layout: "STACK"
    layout-radius: 1.5
    layout-speed: 30
    helix-step: 30
    wave-height: 0
    wave-speed: 0.5
    spin-speed: 0
    bob-height: 0
    bob-speed: 0.5
    orbit-radius: 0
    orbit-speed: 0.25
    pulse-amount: 0
    pulse-speed: 0.5
    sway-angle: 0
    sway-speed: 0.5
    path-speed: 0
    particle: "NONE"
    particle-count: 3
    particle-radius: 0.5
    particle-interval: 10
  line:
    type: "TEXT"
    text: "&#6293F0&lɴᴇxᴏʀᴀ\n&7Edit me with &f/nexora"
    material: "DIAMOND"
    frame-interval: 40
    effect: "NONE"
    effect-speed: 2
    color-a: "#6293F0"
    color-b: "#FFFFFF"
    scroll-width: 16
    scale: 1
    offset-y: 0
    billboard: "CENTER"
    background-default: true
    background: "#40000000"
    shadow: true
    see-through: false
    alignment: "CENTER"
    line-width: 200
    opacity: 255
    glow: false
    glow-color: "#6293F0"
    brightness: -1
    item-transform: "FIXED"
  npc:
    entity-type: "MANNEQUIN"
    name: "&#6293F0&lɴᴇxᴏʀᴀ ɴᴘᴄ"
    name-visible: true
    description: "&7Right-click me"
    skin-name: ""
    skin-value: ""
    skin-signature: ""
    pose: "STANDING"
    glow: false
    glow-color: "blue"
    scale: 1
    look-at: true
    look-range: 8
    actions: "[message] &fHello &#6293F0{player}&f!"
    click-type: "ANY"
    cooldown: 20
    swing-interval: 0
    sneak-interval: 0
    hurt-interval: 0
    spin-speed: 0
    view-range: 48
    path-speed: 0
    particle: "NONE"
    particle-count: 3
    particle-radius: 0.5
    particle-interval: 10

