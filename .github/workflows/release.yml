name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate Mojang-mapped Paper
        run: mvn -B paper-nms:init
      - name: Build
        run: mvn -B package
      - name: Check version matches tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          POM=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$POM" = "$TAG" || { echo "pom version $POM does not match tag $TAG"; exit 1; }
          unzip -p "target/Nexora-$POM.jar" plugin.yml | grep -q "^version: '$POM'$" || { echo "plugin.yml version mismatch"; exit 1; }
      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/Nexora-*.jar --clobber
